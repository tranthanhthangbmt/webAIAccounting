  <script>
    const TOTAL_SLIDES = 15;
    const scriptsData = {"1": "Phân tích Chuyên sâu Bài báo Khoa học: Is it all hype?\nNgười 1: Xin nhiệt liệt chào đón quý thầy cô và các bạn sinh viên Đại học Đông Á, đặc biệt là các bạn sinh viên chuyên ngành Kế toán - Kiểm toán và Tài chính tại Phân hiệu Đắk Lắk! Chào mừng các bạn tiếp tục đồng hành cùng học phần Trí tuệ nhân tạo trong Kế toán - Buổi số 12, Phần 2!\nNgười 2: Xin chào tất cả các bạn! Ở Phần 1 vừa qua, chúng ta đã cùng nhau giải mã nền tảng lý thuyết của Kỷ nguyên Generative AI, tìm hiểu mô hình Cây tư duy (Tree of Thoughts) và Chuỗi tư duy (Chain of Thought). Bước sang Phần 2 hôm nay, chúng ta sẽ bước vào phần hào hứng nhất: Trực tiếp mổ xẻ một công trình khoa học thực chứng quốc tế đỉnh cao vừa được công bố vào tháng 6 năm 2024 trên tạp chí Review of Accounting Studies – một trong những tạp chí học thuật danh giá hàng đầu thế giới về kế toán.\nNgười 1: Bài báo mang một tựa đề vô cùng kích thích tư duy và mang tính thời sự nóng bỏng: \"Is it all hype? ChatGPT's performance and disruptive potential in the accounting and auditing industries\" – tạm dịch là: \"Liệu tất cả chỉ là lời đồn thổi quá đà? Đánh giá năng lực thực tế và tiềm năng đột phá của ChatGPT trong ngành Kế toán và Kiểm toán\". Nhóm tác giả gồm bốn nhà nghiên cứu xuất sắc: Giáo sư Marc Eulerich đến từ Đại học Duisburg-Essen (CHLB Đức), cùng các học giả Aida Sanatizadeh, Hamid Vakilzadeh và đặc biệt là Giáo sư David A. Wood đến từ Đại học Brigham Young (BYU) – người từng dẫn dắt nghiên cứu quy mô toàn cầu về ChatGPT trong kế toán năm 2023.\nNgười 2: Bài học hôm nay do Thầy TS. Trần Thành Thắng chủ trì thiết kế và giảng dạy. Với góc nhìn của những người làm nghề kế toán hiện đại, chúng ta sẽ không phán xét AI bằng cảm tính hay những bài viết giật gân trên mạng xã hội. Chúng ta sẽ dùng chính phương pháp nghiên cứu thực nghiệm khoa học, những con số thống kê chính xác từng phần trăm để trả lời câu hỏi sống còn: AI thực sự giỏi đến đâu, nó có thể vượt qua các kỳ thi sát hạch nghề nghiệp khắc nghiệt nhất hay không, và sinh viên kế toán chúng ta cần làm gì để làm chủ công nghệ này!", "2": "Mục tiêu của Bài phân tích (ToT & CoT)\nNgười 1: Chuyển sang Slide số 2, chúng ta cùng xác định mục tiêu cốt lõi của bài phân tích khoa học hôm nay. Toàn bộ bài giảng được định hình trên hai trụ cột phương pháp luận mà các bạn đã được học: Tree of Thoughts và Chain of Thought.\nNgười 2: Ở trụ cột thứ nhất – Tree of Thoughts (ToT - Khám phá không gian năng lực): Thay vì chỉ coi ChatGPT là một công cụ đơn lẻ, chúng ta sẽ khám phá các nhánh năng lực khác nhau của AI thông qua từng phương pháp Prompting và cấu hình kỹ thuật. Chúng ta sẽ thấy năng lực của AI biến đổi kỳ diệu như thế nào khi đi từ mức độ sơ khai không có hướng dẫn cho đến khi được huấn luyện qua ví dụ và cấp công cụ ngoài.\nNgười 1: Ở trụ cột thứ hai – Chain of Thought (CoT - Chuỗi tư duy logic): Chúng ta sẽ lần theo chuỗi lập luận khoa học cực kỳ chặt chẽ của nhóm tác giả Marc Eulerich và các cộng sự khi họ từng bước \"dạy\" AI giải quyết các bài thi chuyên nghiệp: Làm thế nào để biến một cỗ máy vốn chỉ biết \"đoán chữ học vẹt\" thành một \"Chuyên gia kế toán thông minh dạng Agent\" biết tư duy phản biện và biết sử dụng công cụ tính toán bổ trợ!\nNgười 2: Và mục tiêu tối thượng của cả buổi học hôm nay là trả lời một câu hỏi then chốt: Sự đe dọa của AI đối với công việc kế toán - kiểm toán chỉ là \"lời đồn thổi\" (Hype) của giới truyền thông, hay là \"sự thật hiển hiện\" (Disruptive Reality)? Sau bài học này, các bạn sẽ có được cái nhìn tỉnh táo, bản lĩnh chuyên môn vững vàng và định hướng nghề nghiệp chuẩn xác nhất!", "3": "Bối cảnh: Nỗi sợ hãi và Thực tế phũ phàng\nNgười 1: Để hiểu được tầm quan trọng của bài báo này, slide số 3 đưa chúng ta quay trở lại bối cảnh thị trường trong giai đoạn 2023 - 2024, một thời kỳ đầy rẫy sự hoang mang và những luồng thông tin trái ngược nhau chan chát!\nNgười 2: Ở một thái cực, chúng ta chứng kiến \"Nỗi sợ hãi tột cùng\" hay còn gọi là The Hype. Báo cáo nổi tiếng của Viện Nghiên cứu Toàn cầu McKinsey (McKinsey Global Institute) từng gây rúng động khi dự báo rằng đến năm 2030, Trí tuệ nhân tạo có thể thay thế hoặc làm xáo trộn tới 400 triệu lao động, tương đương 15% lực lượng lao động trên toàn thế giới. Đáng chú ý, các chuyên ngành xử lý dữ liệu và văn bản có cấu trúc như Kế toán, Kiểm toán và Thuế được xếp vào nhóm nguy cơ cao nhất! Báo chí thời điểm đó giật tít liên tục: \"Ngành kế toán sắp biến mất\", \"AI sẽ thay thế toàn bộ kế toán viên\".\nNgười 1: Nhưng ở thái cực ngược lại, thế giới học thuật lại chứng kiến một \"Thực tế phũ phàng\" – The Reality! Vào đầu năm 2023, chính Giáo sư David A. Wood đã dẫn dắt một nghiên cứu chấn động quy mô toàn cầu với sự tham gia của 327 giáo sư từ 186 trường đại học trên thế giới, thử nghiệm cho ChatGPT-3.5 giải các bài thi và bài tập kế toán của sinh viên đại học. Kết quả thật bất ngờ: ChatGPT-3.5 thi trượt thảm hại! Điểm trung bình của AI chỉ đạt 50.9%, kém xa so với mức điểm trung bình 75.3% của các bạn sinh viên người thật! Khi đó, rất nhiều người trong ngành kế toán đã thở phào nhẹ nhõm và cho rằng: AI chỉ là thổi phồng, nó viết văn thì hay chứ hoàn toàn không biết làm kế toán!\nNgười 2: Chính sự mâu thuẫn sâu sắc giữa hai thái cực đó đã đặt ra một bài toán nghiên cứu vô cùng cấp thiết: Liệu kết quả yếu kém của ChatGPT-3.5 là giới hạn vĩnh viễn của công nghệ AI, hay nó chỉ là một nút thắt tạm thời do chúng ta dùng phiên bản cũ và chưa biết cách \"ra lệnh\" đúng cách? Nếu nâng cấp lên GPT-4 và áp dụng các kỹ thuật Prompting hiện đại như Few-shot hay ReAct, liệu AI có thể lật ngược thế cờ hay không? Nhóm nghiên cứu của GS. Eulerich đã quyết định đi tìm câu trả lời thực chứng!", "4": "Phương pháp luận: Bài kiểm tra khắc nghiệt nhất\nNgười 1: Bước sang slide số 4, chúng ta hãy cùng xem nhóm tác giả đã thiết kế bài kiểm tra khắc nghiệt như thế nào để đo lường năng lực thực sự của AI.\nNgười 2: Nhóm nghiên cứu không sử dụng các bài tập đại học thông thường nữa, bởi bài tập đại học có thể quá dễ hoặc bị phân tán. Thay vào đó, họ quyết định đưa AI vào một \"lò lửa thử thách\" thực thụ: Đó là các câu hỏi trắc nghiệm lấy từ ngân hàng đề thi chính thức của 4 kỳ thi chứng chỉ hành nghề kế toán - kiểm toán danh giá và khó bậc nhất hành tinh!\nNgười 1: Kỳ thi thứ nhất là CPA (Certified Public Accountant) – Kế toán Công chứng Hoa Kỳ, tiêu chuẩn vàng của giới tài chính kế toán, bao gồm 4 phần thi toàn diện: AUD (Kiểm toán và Chứng thực), BEC (Môi trường và Khái niệm Kinh doanh), FAR (Báo cáo và Kế toán Tài chính doanh nghiệp), và REG (Quy định pháp luật và Thuế).\nNgười 2: Kỳ thi thứ hai là CMA (Certified Management Accountant) – Chứng chỉ Kế toán Quản trị Hoa Kỳ, gồm 2 phần thi hóc búa về lập kế hoạch tài chính, phân tích hiệu quả hoạt động, kiểm soát chi phí và hỗ trợ ra quyết định chiến lược.\nNgười 1: Kỳ thi thứ ba là CIA (Certified Internal Auditor) – Chứng chỉ Kiểm toán Nội bộ Quốc tế của Viện IIA, gồm 3 phần thi chuyên sâu về khung kiểm soát nội bộ COSO, quản trị rủi ro doanh nghiệp và các quy trình kiểm toán hiện đại.\nNgười 2: Và kỳ thi thứ tư là EA (Enrolled Agent) – Chứng chỉ Đại lý Thuế Liên bang do Sở Thuế vụ Hoa Kỳ (IRS) cấp phép, gồm 3 phần thi cực kỳ chi tiết về Thuế Cá nhân (Individuals), Thuế Doanh nghiệp (Businesses) và Các quy định thủ tục hành nghề thuế. Tổng cộng có tới 12 phần thi độc lập! Để đảm bảo tính khách quan và tập trung vào năng lực ngôn ngữ - suy luận, nhóm tác giả chỉ loại bỏ các câu hỏi có hình ảnh, sơ đồ thị giác và bài tự luận viết dài. Ngưỡng điểm đạt chuẩn được xác định rất rõ ràng: 75% cho CPA, CMA, CIA và 70% đối với chứng chỉ EA.", "5": "Quy trình Thực chứng 4 Bước (Chain of Thought)\nNgười 1: Nhìn vào slide số 5, chúng ta thấy một chuỗi tư duy nghiên cứu thực nghiệm (Chain of Thought) gồm 4 bước tuần tự vô cùng khoa học mà nhóm tác giả đã dày công xây dựng.\nNgười 2: Đây là một thiết kế nghiên cứu mẫu mực, bởi các tác giả không thử nghiệm một lần rồi kết luận ngay, mà họ cô lập từng nhân tố kỹ thuật qua 4 cấp độ để xem đâu là yếu tố thực sự tạo nên sự đột phá của AI.\nNgười 1: Bước 1 là Cột mốc đối chiếu cơ sở (Baseline): Sử dụng mô hình ChatGPT-3.5 với chế độ Zero-shot, nghĩa là chỉ quăng câu hỏi vào và bắt AI trả lời ngay mà không cung cấp bất kỳ ví dụ mẫu nào. Bước này nhằm tái hiện lại kết quả của các nghiên cứu trước đó.\nNgười 2: Bước 2 là Nâng cấp mô hình nền tảng (Model Upgrade): Giữ nguyên kỹ thuật Zero-shot nhưng thay thế toàn bộ bằng mô hình ChatGPT-4 (phiên bản ra mắt tháng 3/2023). Mục đích là để đo lường xem sự tiến hóa thuần túy về phần cứng và cấu trúc tham số khổng lồ của mô hình mới mang lại bao nhiêu phần trăm cải thiện.\nNgười 1: Bước 3 là Huấn luyện tức thời qua ví dụ (Few-shot Training): Vẫn dùng ChatGPT-4, nhưng không bắt nó đoán mò nữa. Nhóm nghiên cứu đưa vào prompt 10 câu hỏi mẫu kèm đáp án đúng và lời giải thích chi tiết (gọi là 10-shot learning) trước khi đưa ra câu hỏi thi thật. Bước này đo lường khả năng học hỏi theo ngữ cảnh (in-context learning) của AI.\nNgười 2: Và Bước 4 chính là Yếu tố thay đổi cuộc chơi (Game Changer) – Kiến trúc ReAct (Reasoning + Acting): Tác giả biến ChatGPT-4 từ một chatbot bị động thành một Tác nhân thông minh (Agent). AI được huấn luyện để phân rã bài toán thành các chuỗi suy nghĩ logic (Reasoning), sau đó được cấp quyền thực hiện hành động (Acting) bằng cách gọi hai công cụ bên ngoài: Máy tính bỏ túi (Calculator) và Công cụ tìm kiếm Web (Web Search). Hãy xem kết quả của từng bước này ở các slide tiếp theo!", "6": "Bước 1: Sự thất bại của AI thế hệ cũ (GPT-3.5)\nNgười 1: Bước vào slide số 6, chúng ta cùng nhìn lại bức tranh ảm đạm của thế hệ AI cũ – ChatGPT-3.5 ở Bước 1.\nNgười 2: Kết quả thực nghiệm của Bước 1 hoàn toàn trùng khớp với những hoài nghi trước đó của giới chuyên môn: ChatGPT-3.5 THI TRƯỢT 100% tất cả 12 phần thi của 4 chứng chỉ nghề nghiệp! Điểm số trung bình toàn bài thi chỉ đạt vỏn vẹn 53.1%, một con số quá xa so với ngưỡng đỗ 70% hay 75%.\nNgười 1: Đi vào chi tiết từng chứng chỉ, chúng ta thấy những con số rất đáng suy ngẫm: Ở kỳ thi CPA, điểm trung bình chỉ là 50.9%. Trong đó, môn Kế toán Tài chính doanh nghiệp (CPA FAR) chỉ đạt 40.6%, và môn Luật & Quy định thuế (CPA REG) chỉ đạt 46.2%. Ở kỳ thi CMA Kế toán Quản trị, điểm trung bình chỉ là 53.3%.\nNgười 2: Đặc biệt thảm hại nhất là ở chứng chỉ Thuế EA: Môn Thuế thu nhập cá nhân (EA IND) chỉ đạt 37.3%! Xin các bạn lưu ý, trong một bài thi trắc nghiệm có 4 phương án lựa chọn A, B, C, D, nếu một người hoàn toàn không biết gì và nhắm mắt khoanh bừa ngẫu nhiên thì xác suất trúng theo lý thuyết đã là 25% rồi! Con số 37.3% của ChatGPT-3.5 cho thấy mô hình này thậm chí bị \"bẫy\" bởi những phương án gây nhiễu trong đề thi thuế!\nNgười 1: Đúng vậy! Lý do là luật thuế cá nhân của Hoa Kỳ có vô vàn các mức giảm trừ gia cảnh, các ngưỡng thu nhập chịu thuế bậc thang và các quy định loại trừ phức tạp. ChatGPT-3.5 chỉ học bề nổi của ngôn ngữ nên khi gặp các tình huống tính thuế lồng ghép nhiều điều kiện, nó đưa ra các kết quả sai lệch hoàn toàn.\nNgười 2: Nhận định rút ra từ Bước 1 rất rõ ràng: Nếu các doanh nghiệp và trường đại học chỉ dừng lại ở việc dùng thử ChatGPT-3.5 miễn phí, họ sẽ có một ảo tưởng an toàn sai lầm rằng: \"AI còn rất lâu nữa mới có thể đe dọa được nghề kế toán\". Nhưng sự thật có dừng lại ở đó không? Chúng ta hãy xem Bước 2!", "7": "Bước 2: Cú nhảy vọt từ công nghệ lõi (GPT-4)\nNgười 1: Sang slide số 7, gió đã bắt đầu đảo chiều! Nhóm tác giả thực hiện Bước 2: Thay thế lõi ChatGPT-3.5 bằng ChatGPT-4 (vẫn giữ nguyên phương thức Zero-shot, hoàn toàn chưa có ví dụ mẫu nào).\nNgười 2: Kết quả đã tạo ra một cú sốc thực sự trong giới nghiên cứu: Điểm số trung bình trên toàn bộ các môn thi đã tăng vọt thêm 16.5%, chạm mốc 69.6% – tiệm cận ngay sát ngưỡng đỗ quy ước!\nNgười 1: Cột mốc lịch sử đầu tiên đã xuất hiện: GPT-4 đã tự mình thi đỗ 5 phần thi độc lập, và thành tựu rực rỡ nhất là nó đã ĐỖ TOÀN BỘ CHỨNG CHỈ KIỂM TOÁN NỘI BỘ (CIA)! Điểm trung bình của 3 phần thi CIA đạt tới 76.4%, trong đó Phần 1 đạt 75.3%, Phần 2 đạt 76.0% và Phần 3 đạt 78.0%. Ngoài ra, ở kỳ thi CPA, môn Kiểm toán AUD đã vọt lên 82.1% (tăng tới 24.7% so với bản cũ), và môn Quy định hành nghề thuế EA RPP đạt tới 80.7%!\nNgười 2: Tại sao GPT-4 lại thi đỗ xuất sắc các môn Kiểm toán nội bộ (CIA) và Kiểm toán độc lập (AUD) như vậy? Thưa các bạn, đó là vì bản chất của kiểm toán là đọc hiểu các chuẩn mực kiểm toán, đánh giá tính hữu hiệu của hệ thống kiểm soát nội bộ, nhận diện xung đột lợi ích và tư duy logic tuân thủ. GPT-4 sở hữu năng lực đọc hiểu ngữ cảnh sâu sắc và khả năng suy luận ngôn ngữ vượt bậc, nên nó xử lý các câu hỏi tình huống kiểm toán xuất sắc không thua kém gì một kiểm toán viên có kinh nghiệm!\nNgười 1: Tuy nhiên, slide số 7 cũng chỉ ra một giới hạn then chốt: Dù điểm số tăng vọt, GPT-4 vẫn trượt ở các môn thi đòi hỏi tính toán số liệu phức tạp: CPA FAR chỉ đạt 49.8%, EA Thuế cá nhân chỉ đạt 59.3%, và CMA Kế toán Quản trị chỉ đạt 65.9%. Nó nắm rất vững lý thuyết kế toán, nhưng hễ cứ đụng đến việc cộng trừ nhân chia số dư tài khoản hay tính thuế luỹ tiến là nó lại bắt đầu mắc lỗi!", "8": "Bước 3: Sức mạnh của Few-shot Prompting\nNgười 1: Để khắc phục điểm yếu đó, nhóm tác giả tiến hành Bước 3 trên slide số 8: Áp dụng kỹ thuật Few-shot Prompting, cụ thể là \"10-Shot Training\".\nNgười 2: Thay vì quăng câu hỏi trần trụi vào cho AI giải ngay, nhóm nghiên cứu đã đưa vào ngữ cảnh của Prompt 10 câu hỏi mẫu của kỳ thi đó kèm theo đáp án chính xác và lời giải thích quy trình tư duy chuẩn. 10 ví dụ này đóng vai trò như những \"phát súng hiệu\", giúp mô hình căn chỉnh lại không gian biểu diễn tri thức trước khi bước vào giải câu hỏi chính thức.\nNgười 1: Kết quả mang lại vô cùng ấn tượng: Điểm số trung bình toàn diện tiếp tục tăng thêm 6.6%, chính thức vượt ngưỡng trung bình đạt 76.2%!\nNgười 2: Và thành tựu lớn thứ hai đã được xác lập: Nhờ có 10 ví dụ mẫu dẫn đường, ChatGPT-4 đã CHÍNH THỨC THI ĐỖ TOÀN BỘ CHỨNG CHỈ KẾ TOÁN QUẢN TRỊ (CMA)! Điểm trung bình của CMA đạt 72.0%, trong đó Phần 1 đạt 72.7% và Phần 2 đạt 71.3%, vượt qua điểm chuẩn của kỳ thi CMA. Ở môn CPA AUD, điểm số leo lên mức kỷ lục 87.5%!\nNgười 1: Cơ chế nào giúp Few-shot Prompting tạo ra sự khác biệt lớn như vậy? Trong lý thuyết học máy, đây gọi là hiện tượng \"In-Context Learning\" – học tập trong ngữ cảnh. 10 ví dụ mẫu giúp LLM hiểu được phong cách hành văn của đề thi chuyên nghiệp, nhận diện các thuật ngữ viết tắt của ngành, và đặc biệt là nắm được \"logic bẫy\" mà hội đồng giám khảo hay cài cắm.\nNgười 2: Thế nhưng, nhóm tác giả nhận thấy một rào cản kỹ thuật vẫn chưa bị phá vỡ: Mặc dù đã có 10 ví dụ mẫu, AI vẫn chưa thể vượt qua môn Kế toán Tài chính CPA FAR (chỉ đạt 64.5%) và Thuế cá nhân EA IND (chỉ đạt 66.7%). Căn nguyên sâu xa là gì? Là vì bản chất của một Mô hình Ngôn ngữ Lớn là tính toán xác suất token của từ tiếp theo. Khi phải nhân chia các con số lớn có nhiều chữ số thập phân, nó vẫn cố tình \"nhẩm tính\" bằng mạng nơ-ron chữ, dẫn đến những sai số ngớ ngẩn! Và để giải quyết triệt để vấn đề này, chúng ta cần đến vũ khí tối thượng ở slide số 9!", "9": "Bước 4: Game Changer - Kiến trúc ReAct (Agents)\nNgười 1: Chào mừng các bạn đến với slide số 9 – bước ngoặt vĩ đại nhất của công trình nghiên cứu: Ứng dụng Kiến trúc Tác nhân ReAct (Reasoning + Acting) kết hợp công cụ bổ trợ!\nNgười 2: Nhóm tác giả đã nhận định cực kỳ chuẩn xác: Yêu cầu một mô hình ngôn ngữ lớn làm toán số học cũng giống như việc bắt một nhà văn đại tài phải tính nhẩm căn bậc hai của một số có 10 chữ số mà không cho dùng giấy bút! Nó sai không phải vì nó dốt tư duy, mà vì nó không được trang bị công cụ thích hợp.\nNgười 1: Chính vì thế, nhóm nghiên cứu đã áp dụng framework ReAct của Yao et al., tích hợp ChatGPT-4 vào một hệ thống tác nhân (Agent) thông qua thư viện kết nối như LangChain. Kiến trúc này hoạt động theo một vòng lặp logic:\nThứ nhất là Reasoning (Suy luận): Khi nhận được câu hỏi kế toán, AI phải tự viết ra suy nghĩ (Thought): \"Bài toán này yêu cầu tính khấu hao tài sản cố định theo phương pháp số dư giảm dần. Bước 1 cần xác định nguyên giá, Bước 2 tính tỷ lệ khấu hao, Bước 3 thực hiện phép nhân\".\nNgười 2: Thứ hai là Acting (Hành động): Khi nhận diện được công thức toán học, AI KHÔNG TỰ NHẨM NỮA! Nó kích hoạt công cụ bên ngoài: Đó là Máy tính bỏ túi (Calculator) chạy bằng mã code Python chuẩn xác tuyệt đối đến từng con số 0! Đồng thời, nó được cấp thêm công cụ Tìm kiếm Web (Web Search) để tra cứu các văn bản luật thuế và tỷ giá ngoại tệ hiện hành.\nNgười 1: Sau khi công cụ trả về kết quả chính xác, AI thực hiện bước Observation (Quan sát), ghép số liệu chuẩn vào lập luận và đưa ra câu trả lời cuối cùng.\nNgười 2: Và kết quả thực nghiệm của Bước 4 đã tạo nên một cơn địa chấn trong giới học thuật: Điểm số trung bình toàn diện tăng vọt thêm 8.9%, đạt con số kỷ lục 85.1%! Toàn bộ các môn thi vốn là điểm yếu chí mạng về tính toán đều bùng nổ: CPA FAR từ 64.5% vọt thẳng lên 78.0% (tăng tới 13.5%)! CMA Phần 2 từ 71.3% nhảy vọt lên 88.5% (tăng tới 17.2%)! Và EA Thuế cá nhân từ 66.7% vọt lên 78.2%!", "10": "Kết luận về Năng lực: AI đã \"Tốt nghiệp\"\nNgười 1: Bước sang slide số 10, chúng ta chứng kiến thời khắc lịch sử của nghiên cứu: Bảng tổng kết năng lực toàn diện khẳng định AI ĐÃ CHÍNH THỨC \"TỐT NGHIỆP\"!\nNgười 2: Hãy nhìn vào kết quả tổng thể: Với kiến trúc ReAct kết hợp công cụ máy tính, ChatGPT-4 ĐÃ THI ĐỖ 100% TẤT CẢ 12 PHẦN THI CỦA CẢ 4 KỲ THI CHỨNG CHỈ NGHỀ NGHIỆP DANH GIÁ NHẤT:\nĐiểm trung bình CPA đạt 84.3% (vượt xa mức chuẩn 75%), trong đó môn Kiểm toán AUD đạt tới 91.5%!\nĐiểm trung bình CMA Kế toán Quản trị đạt 86.6%!\nĐiểm trung bình CIA Kiểm toán Nội bộ đạt 85.5%!\nVà điểm trung bình EA Đại lý Thuế đạt 83.8%!\nNgười 1: Đặc biệt, slide số 10 trình bày một phát hiện vô cùng sâu sắc từ Bảng số 5 của bài báo: Phân tích hiệu quả theo Bản chất câu hỏi. Bài thi CPA chia các câu hỏi thành hai nhóm: Nhóm câu hỏi \"Ghi nhớ và Hiểu biết\" (Remembering & Understanding) và Nhóm câu hỏi \"Vận dụng chuyên môn\" (Application).\nNgười 2: Các bạn hãy nhìn vào nhóm câu hỏi \"Vận dụng\": Ở ChatGPT-3.5, AI chỉ đạt 40.9%. Sang GPT-4 Zero-shot đạt 54.9%. Sang Few-shot đạt 62.3%. Và khi kích hoạt ReAct với Máy tính bỏ túi, tỷ lệ chính xác ở các câu hỏi Vận dụng tăng vọt thêm 15.1%, đạt mức 77.4%! Điều này chứng minh rằng: Khi được trang bị đúng công cụ, AI hoàn toàn có khả năng giải quyết các tình huống kế toán và thuế mang tính vận dụng phức tạp chứ không chỉ đơn thuần là nhớ lại các định nghĩa lý thuyết suông!\nNgười 1: Đến đây, nhóm tác giả Marc Eulerich và David Wood đã đưa ra câu trả lời đanh thép cho câu hỏi đặt ở tựa đề bài báo: \"Is it all hype?\" – KHÔNG! Đây hoàn toàn không phải là lời đồn thổi quá đà của giới truyền thông! Khả năng phá vỡ (disruptive potential) của Generative AI trong ngành kế toán - kiểm toán là một sự thật hiển nhiên và có cơ sở khoa học vững chắc!", "11": "Tác động đến Giáo dục Kế toán (Education)\nNgười 1: Từ kết quả thực chứng chấn động đó, bài báo ở Mục 5 đã mở rộng phân tích những tác động sâu sắc đang diễn ra ngay trong đời sống thực tế. Slide số 11 tập trung vào mảng đầu tiên: Tác động đến Giáo dục Kế toán tại các trường đại học.\nNgười 2: Giáo sư Eulerich và các cộng sự chỉ ra rằng, Generative AI đang thay đổi hoàn toàn cách dạy và học kế toán thông qua 3 trụ cột:\nTrụ cột thứ nhất là Sự xuất hiện của các Trợ giảng AI chuyên biệt (TA-bots). Nghiên cứu dẫn chứng một thử nghiệm thực tế tại chính trường đại học của tác giả: Một Chatbot AI được huấn luyện trên giáo trình và tài liệu của môn học Hệ thống thông tin kế toán đã giải đáp tới 51,000 câu hỏi truy vấn của sinh viên chỉ trong nửa học kỳ! Tỷ lệ câu trả lời chính xác được kiểm định đạt trên 95%, và điều kinh ngạc nhất là chi phí vận hành toàn bộ hệ thống này chỉ tốn chưa đầy 200 USD mỗi tháng!\nNgười 1: Trụ cột thứ hai là Tự động hóa Chấm điểm và Phản hồi học tập: AI không chỉ chấm các bài trắc nghiệm thông thường, mà đang được thử nghiệm để đọc hiểu các bài luận kế toán, phân tích các bài tập giải quyết tình huống (Case studies) và đưa ra những lời nhận xét, góp ý chi tiết cho từng cá nhân sinh viên ngay lập tức, giúp sinh viên nhận ra sai sót trong quy trình định khoản của mình mà không cần chờ đợi cả tuần lễ.\nNgười 2: Và trụ cột thứ ba – một sự thay đổi mang tính triết lý giáo dục: Sự chuyển dịch vai trò của người Thầy! Nhóm tác giả nhấn mạnh: Giảng viên đại học sẽ không còn đóng vai trò là \"Người thuyết giảng độc thoại trên bục giảng\" – sage-on-the-stage, mà sẽ chuyển hóa thành \"Người cố vấn, định hướng đồng hành bên cạnh sinh viên\" – guide-at-the-side.\nNgười 1: Sinh viên đến giảng đường Đại học Đông Á không phải để nghe lại những lý thuyết định nghĩa mà AI có thể đọc vanh vách trong một giây. Giờ học trên lớp sẽ là nơi chúng ta cùng nhau phản biện, thảo luận các tình huống đạo đức nghề nghiệp phức tạp, giải quyết các bài toán kinh doanh thực tế và học cách chỉ huy các hệ thống AI phục vụ cho công việc kế toán!", "12": "Tác động đến Thực tiễn Nghề nghiệp (Business)\nNgười 1: Bước sang slide số 12, chúng ta cùng nhìn ra thế giới doanh nghiệp và các hãng kiểm toán hàng đầu: Thị trường thực tế đang phản ứng như thế nào trước làn sóng này?\nNgười 2: Những số liệu được công bố trong bài báo cho thấy các tập đoàn kiểm toán Big 4 không hề chần chừ, họ đang rót những khoản tiền khổng lồ vào cuộc đua vũ trang Generative AI:\nHãng PwC cam kết đầu tư tới 1 tỷ USD trong vòng 3 năm vào các giải pháp Generative AI và ký thỏa thuận hợp tác chiến lược mở rộng với Microsoft và OpenAI.\nHãng KPMG công bố gói đầu tư lên tới 2 tỷ USD vào trí tuệ nhân tạo và công nghệ đám mây trên toàn cầu.\nHãng EY đầu tư 1.5 tỷ USD, xây dựng nền tảng EY.ai và ra mắt hàng loạt công cụ chuyên dụng.\nNgười 1: Bài báo nêu bật một ví dụ điển hình của EY: Đó là Chatbot Bảng lương Thông minh (Intelligent Payroll Chatbot). Trước đây, mỗi kỳ tính lương, các chuyên viên nhân sự và kế toán phải đối mặt với hàng chục nghìn thắc mắc của người lao động về các khoản khấu trừ thuế, bảo hiểm, làm thêm giờ. Chatbot của EY có khả năng đọc hiểu trực tiếp phiếu lương cá nhân của từng nhân viên, tra cứu chính sách công ty và giải thích cặn kẽ mọi thắc mắc bằng ngôn ngữ tự nhiên. Hệ thống này đã giúp giảm hơn 50% khối lượng công việc thủ công của bộ phận kế toán tiền lương!\nNgười 2: Bên cạnh đó, tập đoàn truyền thông và dữ liệu tài chính Bloomberg đã tự phát triển mô hình BloombergGPT – một mô hình ngôn ngữ lớn 50 tỷ tham số được huấn luyện chuyên biệt trên kho dữ liệu tài chính kế toán suốt nhiều thập kỷ. Và theo khảo sát chính thức của KPMG được trích dẫn trong bài báo: Có tới 65% lãnh đạo các doanh nghiệp quy mô lớn khẳng định họ đã hoặc đang tích hợp AI vào quy trình lập Báo cáo Tài chính và Kiểm toán! Điều này cho thấy AI không còn là câu chuyện của tương lai, mà nó đang diễn ra hàng ngày hàng giờ trong các phòng kế toán trên khắp thế giới!", "13": "Những Giới hạn của AI và Cơ hội cho Con người\nNgười 1: Mặc dù những thành tựu của AI là vô cùng ngoạn mục, slide số 13 mang tính thức tỉnh rất cao khi nhóm tác giả Eulerich et al. thẳng thắn chỉ ra những Giới hạn cốt tử của AI và khẳng định vị thế không thể thay thế của con người.\nNgười 2: Giới hạn thứ nhất là ranh giới giữa \"Biết\" và \"Làm\" (Knowing vs. Doing). Việc một mô hình AI trả lời đúng 100 câu trắc nghiệm hoàn toàn không đồng nghĩa với việc nó có thể tự mình vận hành công việc kế toán trong thực tế! Trong thực tế, kế toán viên phải đăng nhập vào các hệ thống ERP phức tạp như SAP hay Oracle, xử lý những hóa đơn mua hàng nhàu nát, giải quyết các khoản chênh lệch đối chiếu ngân hàng (Bank reconciliations) rối rắm, và trực tiếp giao tiếp với các phòng ban để thu thập chứng từ. AI hoàn toàn chưa thể tự mình thực hiện trọn vẹn chuỗi quy trình tác nghiệp vật lý này.\nNgười 1: Giới hạn thứ hai là Khả năng thị giác và Dữ liệu phi cấu trúc phức tạp: Trong nghiên cứu của mình, nhóm tác giả buộc phải loại bỏ các câu hỏi chứa biểu đồ, hình vẽ kỹ thuật và sơ đồ luồng chứng từ. Trong thực tế kiểm toán, các bạn phải đọc bản vẽ nghiệm thu công trình xây dựng dở dang, kiểm đếm kho hàng tồn kho thực địa, và phân tích các sơ đồ kiểm soát nội bộ. Đây là những lĩnh vực mà AI thị giác hiện tại vẫn còn rất nhiều hạn chế.\nNgười 2: Và giới hạn thứ ba nguy hiểm nhất: Hiện tượng Ảo giác (Hallucination) và Sự tự tin thái quá! Dù đã được trang bị kiến trúc ReAct, LLM đôi khi vẫn có thể đưa ra những diễn giải sai lệch về chuẩn mực hoặc tính sai một tham số ngầm định, nhưng giọng điệu phản hồi của nó luôn tỏ ra cực kỳ tự tin, logic và thuyết phục! Nếu người làm kế toán thiếu bản lĩnh chuyên môn, nhắm mắt sao chép kết quả của AI đưa vào Báo cáo tài chính nộp cơ quan thuế, hậu quả pháp lý và thiệt hại tài chính sẽ là khôn lường!\nNgười 1: Và đây chính là Cơ hội vàng cho các bạn sinh viên! Con người không cần phải cạnh tranh với AI về tốc độ ghi nhớ hay tính toán. Giá trị cốt lõi của người làm kế toán - kiểm toán nằm ở Tư duy hoài nghi nghề nghiệp (Professional Skepticism), năng lực phán đoán đạo đức, thấu hiểu bối cảnh kinh doanh và là người cuối cùng chịu trách nhiệm pháp lý trước pháp luật và xã hội!", "14": "Tổng kết Bài học Buổi 12\nNgười 1: Bước sang slide số 14, chúng ta cùng đúc kết lại toàn bộ tinh hoa của bài học ngày hôm nay thành 3 thông điệp chiến lược quan trọng nhất.\nNgười 2: Thông điệp thứ nhất: Sức mạnh thực sự của Trí tuệ nhân tạo không nằm ở mô hình gốc Zero-shot, mà nằm ở Kỹ thuật viết Prompt (Few-shot) và Thiết kế kiến trúc giải pháp thông minh (ReAct / AI Agents). Một người chỉ biết gõ vài câu hỏi đơn giản vào ChatGPT sẽ mãi mãi thất vọng vì sai số, nhưng một người biết áp dụng Chuỗi tư duy CoT, biết cấp công cụ tính toán và thiết kế luồng kiểm tra chéo sẽ sở hữu một trợ lý kế toán có năng lực siêu việt!\nNgười 1: Thông điệp thứ hai – một câu châm ngôn nổi tiếng của thời đại số: \"Kế toán viên tương lai không cần sợ AI sẽ cướp mất việc làm của mình. Điều các bạn cần sợ là những đồng nghiệp kế toán biết sử dụng thành thạo AI sẽ vượt lên thay thế các bạn!\". Công nghệ không tự đào thải con người, mà sự chậm trễ trong việc thích ứng mới chính là nguyên nhân khiến chúng ta tụt lại phía sau.\nNgười 2: Và thông điệp thứ ba: Bộ năng lực cốt lõi mới của sinh viên Kế toán - Kiểm toán thế hệ mới đã thay đổi hoàn toàn: Các bạn không còn là những người ghi sổ thủ công, mà đang tiến hóa thành:\nNhững người thiết kế bài toán kinh doanh (Problem Designers);\nNhững người kỹ sư ra lệnh và thiết lập tham số cho AI (Prompt Engineers);\nVà quan trọng nhất: Những chuyên gia kiểm toán và thẩm định chất lượng dữ liệu do AI tạo ra (AI Auditors & Quality Controllers)!", "15": "Câu hỏi Thảo luận & Case Study Cuối giờ\nNgười 1: Khép lại bài học đầy bổ ích hôm nay, slide số 15 mở ra một tình huống thực hành thảo luận vô cùng thiết thực dành cho toàn thể các bạn sinh viên trong 10 phút cuối giờ.\nNgười 2: Hãy lắng nghe kỹ tình huống Case Study sau đây:\n\"Bạn vừa được tuyển dụng làm Chuyên viên phân tích tài chính tại một doanh nghiệp kinh doanh nông sản lớn tại khu vực Tây Nguyên. Bạn đang sử dụng ChatGPT phiên bản miễn phí – nghĩa là phiên bản không có tính năng máy tính tích hợp Code Interpreter hay Web Search – để hỗ trợ phân tích biến động các tỷ số tài chính trọng yếu là Tỷ suất sinh lời trên tài sản (ROA) và Tỷ suất sinh lời trên vốn chủ sở hữu (ROE) qua 3 năm liên tiếp, với các số liệu doanh thu và tổng tài sản lên tới hàng nghìn tỷ đồng.\nDựa trên những bài học từ nghiên cứu của GS. Marc Eulerich hôm nay, làm thế nào để bạn thiết kế một cấu trúc Prompt theo phương pháp Chuỗi tư duy (Chain of Thought) nhằm đảm bảo ChatGPT đưa ra các nhận định phân tích xu hướng chuẩn xác, mà tuyệt đối không bị mắc các lỗi tính toán số học do phép chia các con số lớn?\".\nNgười 1: Một câu hỏi thực chiến vô cùng thú vị! Thầy xin gợi ý cho các bạn 3 bước tư duy:\nThứ nhất, đừng bao giờ ném nguyên bảng số liệu vào và bảo AI: \"Hãy tính ROA và nhận định ngay cho tôi\".\nThứ hai, hãy chia nhỏ Prompt: Yêu cầu AI nêu công thức chuẩn mực trước, sau đó yêu cầu AI xuất ra công thức tính toán dạng hàm Excel (như hàm SUM, AVERAGE) hoặc viết mã Python để bạn tự chạy, hoặc chính bạn là người thực hiện phép chia trên máy tính cầm tay rồi nạp kết quả vào để AI tập trung làm đúng thế mạnh của nó là diễn giải ý nghĩa kinh tế và đối sánh với ngành!\nNgười 2: Đúng vậy! Đó chính là cách chúng ta làm chủ công cụ: Biến điểm yếu thành điểm kiểm soát, tận dụng tối đa thế mạnh ngôn ngữ và suy luận của AI!\nCác bạn hãy dành 10 phút thảo luận theo nhóm 3 người, phác thảo cấu trúc Prompt của mình vào khung chat của lớp học. Thầy Thắng và các thầy cô trợ giảng sẽ cùng chấm điểm và nhận xét trực tiếp bài làm của các nhóm!\nNgười 1: Xin chân thành cảm ơn sự chú ý lắng nghe, tinh thần học tập nghiêm túc và say mê nghiên cứu khoa học của toàn thể các bạn sinh viên Phân hiệu Đắk Lắk – Đại học Đông Á! Chúc các bạn luôn tự tin, vững vàng và trở thành những nhà kế toán - kiểm toán công nghệ xuất sắc của tương lai. Xin chào và hẹn gặp lại các bạn trong buổi học tiếp theo!"};

    let currentIndex = 1;
    let isPlaying = false;
    let autoPlayTimer = null;

    const slideImg = document.getElementById('slideImg');
    const slideAudio = document.getElementById('slideAudio');
    const slideCounter = document.getElementById('slideCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const spinner = document.getElementById('spinner');
    const transcriptDrawer = document.getElementById('transcriptDrawer');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerBody = document.getElementById('drawerBody');
    const toggleTranscriptBtn = document.getElementById('toggleTranscriptBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function updateTranscript(index) {
      drawerTitle.textContent = `Kịch bản Lời thoại — Slide ${index} / ${TOTAL_SLIDES}`;
      const text = scriptsData[index] || "Chưa có kịch bản cho slide này.";
      // Format Người 1 and Người 2 bold
      const formatted = text
        .replace(/(Người 1:)/g, "<strong>$1</strong>")
        .replace(/(Người 2:)/g, "<strong>$2</strong>");
      drawerBody.innerHTML = formatted;
    }

    function showSlide(index) {
      if (index < 1) index = 1;
      if (index > TOTAL_SLIDES) index = TOTAL_SLIDES;
      currentIndex = index;

      slideCounter.textContent = `${index} / ${TOTAL_SLIDES}`;
      prevBtn.disabled = (index === 1);
      nextBtn.disabled = (index === TOTAL_SLIDES);

      // Show spinner briefly
      spinner.classList.add('active');

      // Update image
      const newImg = new Image();
      newImg.src = `images/slide-${index}.png`;
      newImg.onload = () => {
        slideImg.src = newImg.src;
        spinner.classList.remove('active');
      };
      newImg.onerror = () => {
        spinner.classList.remove('active');
      };

      // Update transcript
      updateTranscript(index);

      // Try audio
      slideAudio.pause();
      clearTimeout(autoPlayTimer);

      const audioSrc = `audio/slide_${index}.mp3`;
      slideAudio.src = audioSrc;

      slideAudio.oncanplaythrough = () => {
        if (isPlaying) slideAudio.play();
      };

      slideAudio.onerror = () => {
        // Audio not found, use fallback timer if playing
        if (isPlaying) {
          autoPlayTimer = setTimeout(() => {
            if (currentIndex < TOTAL_SLIDES) {
              showSlide(currentIndex + 1);
            } else {
              stopPlayback();
            }
          }, 12000); // 12 seconds per slide fallback
        }
      };

      slideAudio.onended = () => {
        if (isPlaying) {
          if (currentIndex < TOTAL_SLIDES) {
            showSlide(currentIndex + 1);
          } else {
            stopPlayback();
          }
        }
      };
    }

    function startPlayback() {
      isPlaying = true;
      playBtn.textContent = '⏸';
      playBtn.style.background = '#eab308';
      slideAudio.play().catch(() => {
        // Autoplay fallback timer
        clearTimeout(autoPlayTimer);
        autoPlayTimer = setTimeout(() => {
          if (currentIndex < TOTAL_SLIDES) {
            showSlide(currentIndex + 1);
          } else {
            stopPlayback();
          }
        }, 12000);
      });
    }

    function stopPlayback() {
      isPlaying = false;
      playBtn.textContent = '▶';
      playBtn.style.background = 'var(--ok)';
      slideAudio.pause();
      clearTimeout(autoPlayTimer);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 1) showSlide(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < TOTAL_SLIDES) showSlide(currentIndex + 1);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        if (currentIndex > 1) showSlide(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        if (currentIndex < TOTAL_SLIDES) showSlide(currentIndex + 1);
      } else if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // Transcript toggle
    toggleTranscriptBtn.addEventListener('click', () => {
      transcriptDrawer.classList.toggle('open');
    });

    drawerCloseBtn.addEventListener('click', () => {
      transcriptDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Initial load
    showSlide(1);
  </script>
</body>
</html>
