5.1 SEGMENTING CUSTOMERS
Vegan-Always is a new restaurant opening in Phoenix. It wants to send out
coupons to customers who enjoy vegan food. Should it send these coupons to all
residents of Phoenix? While this can be done, not only would such extensive
coupon distribution become very expensive, but not everyone would be interested
in the restaurant’ s offerings. Since not all customers are alike or share the same
tastes, sending the same marketing message to everyone is not ef ficient or
profitable. The best strategy for V egan-Always is to divide the entire population of
Phoenix in such a way that it can send the coupons only to those who are likely to
visit the restaurant. One way the restaurant can do this is by using
psychographics or lifestyle factors. People who are more environmentally
conscious have turned to veganism and might be more interested in such a
restaurant.
Similarly , demographics can be another way to find groups of customers who
would be relevant for the restaurant. Such a process of dividing the market into
groups of customers with similar characteristics and selecting the most
appropriate group(s) for the business to target is called market segmentation.
One way to think of segmentation is as a comprise between mass marketing
(which assumes that all customers are the same) and individual-level
customization (which assumes that all customers are unique). Instead of targeting
each customer , segmentation allows a business to target groups of customers
who are similar in the way they respond to the product. In today’ s data-driven
markets, it is now possible to segment at a deeper level; hence, microsegmenting
is becoming popular . For example, based on past buying behavior and similarity
to other customers, Amazon has the ability to create microsegments and
recommend very specific products to each of its customers.
The first step in market segmentation is to know why customers are buying a
product. What benefits is the product of fering that a customer may be interested
in? The business needs to identify all customer needs that a product or service
can fulfill. For instance, an automobile can be purchased to satisfy transportation
needs or status needs. Knowing exactly which need is being satisfied for which
group of customers can help in more accurate messaging and targeting.
Identifying product-related needs can run the gamut from using traditional
methods such as focus groups and surveys to the recent natural language
processing (NLP) methods that can be used to mine customer opinions and
reviews. Customer needs may not be restricted to just product features but may
also include the company reputation. In the 1990s, Nike lost sales because of
news that it was using child labor in its manufacturing units. The company had to
change its working conditions because customers also wanted Nike to use the
right practices. Once customers’  needs are identified, customers can be
categorized into groups with similar needs that form the dif ferent segments  for
that business. Developing a market with an imaginary buyer whose
characteristics are inaccurate is a recipe for failure. Many products have failed not
because they were bad but because they were marketed to the wrong set of
customers.
After businesses have grouped customers with similar characteristics in terms of
how they respond to product benefits, they can then decide which of these
customer groups are most profitable to target. The process of determining which
of the segments of fer good market opportunities is called targeting . Finally , when
businesses have segmented customers and decided which of these segments to
target, they need to determine how they want to position their products in the
minds of their customers. Positioning  can be described as instilling a meaning in
customers’  minds that is unique to that product. W e will first understand
segmentation in detail before moving on to targeting and positioning.
Segmentation, targeting, and positioning are generally known as the STPs of
marketing  since these three steps tend to be conducted together .
An initial step in segmentation is to group customers by similarities in their
characteristics. Customers may seek similar benefits from a product because they
live in the same region. For instance, customers who share geographic similarity
may face the same weather conditions; people living in colder climes may need
heavier jackets that can provide warmth compared to those living in warmer
places where such jackets may not be necessary .
We next discuss the dif ferent basis on which customers could be grouped
together in terms of similar characteristics.
5.5.1 Basis of Segmentation
Geographic . Customers can be segmented based on where they live. For
instance, an insurance company might of fer dif ferent types of insurance based on
whether customers are located in regions prone to tornadoes, floods, or
earthquakes.
Demographic.  A very common way to segment customers is by demographic
features such as age, education, gender , income, and occupation. For example,
businesses may target millennials dif ferently from baby boomers. Baby boomers
account for a large share of the market currently because they control a major
portion of the disposable income in the United States, which makes them a very
attractive segment of the market. Hence, it is important that a business planning
to target baby boomers understand the features of this segment. Are they health
conscious? Are they tech savvy? W ould they be willing to buy online? Are they
philanthropic compared to other segments? Businesses also need to keep in
mind that features defining a group change with time. W omen now purchase
repair tools as often as men.
Psychological.  Customers can be segmented based on their dif ferent
psychological factors, such as motivation, personality , and perceptions.
Customers can purchase a brand to satisfy a prestige motive or for a functional
motive. Rolex and Timex both manufacture watches, but people might be buying
them for dif ferent motives. Personality can also be used to segment customers.
Companies could consider the Big 5 personality traits1 such as whether an
individual is extroverted, disinhibited, neurotic, conscientious, or open to
experience. Or a business could focus on personality traits that have been shown
to affect marketplace decisions, such as impulsivity , loyalty , frugality ,
innovativeness, variety seeking, and risk aversion. Despite psychological factors
being very informative of how customers may behave in the marketplace, it is
difficult to obtain this information. Until recently , one way has been through the
use of surveys, but this cannot be done for all customers and may be
inconvenient and expensive. Some work has demonstrated that digital footprints
of customers can be used to predict their personality . Digital footprints can be in
the form of text, messages in online forums, number of likes, size of the networks
frequented, and so on. Knowing the personality of customers allows for deeper
customization of messages and recommendations targeting these individuals.
Sociocultural.  This could include stages in the life cycle, such as whether one is
single, married, or an empty nester , or social class, such as whether one belongs
to the upper , lower , middle, or working class. It also could include cultural values,
a very personal way that individuals define their core beliefs. Since cultural
segmentation maps onto core beliefs and values, it can help the business or
brand connect with a customer at a more meaningful level. In this age of
globalization, with products marketed across the world, being able to connect to
unique cultures is a challenge and yet a big asset if it can be done successfully .
Psychographic.  The psychographic basis of segmentation includes activities,
interests, and opinions of customers. Customers who like to vacation in
Yellowstone are likely to share similar interests and require dif ferent messaging
tactics than those who prefer a Disneyland vacation. Customers with dif ferent
political opinions (e.g., conservative versus liberal) may respond to dif ferent
marketing strategies. Those who are risk averse may not be open to buying a
product that is positioned as adventurous.
Benefit Sought.  What kind of benefits are people likely to look for when buying a
product? Let’ s take the example of running shoes. They could provide more than
one benefit, such as durability , comfort, speed, and appearance. They could even
be used for some form of social signaling to inform others that one is a runner .
Multivitamins are another example of a product that could convey dif ferent
benefits for dif ferent segments of customers—such as strength, prevention of
illness, and boosting of immunity .
Usage V olume.  Customers can be segmented based on how often they buy a
product and how often they use it (i.e., whether they are heavy , medium, or light
users). It is possible that heavy users form a smaller percentage of the total users
of a product but may actually buy a substantial share of the product. Hence, they
are an important segment to focus on.
Product Attitude.  Having information about the type of attitude customers hold
about a brand can help determine how they will react to a new or modified of fering
by the brand. Some customers may have extremely favorable or extremely
unfavorable brand attitudes. For example, some PC users would not think of
using a Mac, and vice versa. Such potentially nonconvertible customer segments
may not be worth targeting.
5.2 TARGETING POTENTIAL CUSTOMERS
Segmentation reveals specific market opportunities. Once customers have been
segmented based on how they respond to product features, the business needs
to evaluate the customer segments and decide which to target. It rarely happens
that a product has mass appeal. Therefore, finding the segments that are likely to
purchase the product is important. W e can understand the process of selecting
viable segments to target through the following questions that a business needs
to ask.
Are there enough segments in the market worth targeting? Having a product
that is liked by a very small group of customers indicates that the business
may have a niche product, which may not be profitable on a broader level.
Is the segment stable, and will it remain stable for some time? It’ s not ideal if
the target segments are comprised of people who are interested in fads.
Growing and stable segments are more attractive and more likely to be
profitable in the long term.
Are the segments accessible? For instance, a large segment of customers
may be interested in the product but may be in a place where it cannot be
accessed easily .
How well does this product compare with the competition in the chosen target
segments? If the product is not the innovator or the first entrant in the market,
chances are there are one or more businesses already catering to the
segments that the business finds attractive. The business needs to find out
how their product compares to existing products. If the business already has
very strong competitors catering to a segment and the segment is also very
brand loyal, it may be very hard to break into such a market.
5.3 POSITIONING THE PRODUCT IN
CUSTOMERS’ MINDS
Positioning is defined as an ef fort by a business to identify a unique selling
proposition that allows its product to occupy a clear , distinctive, and attractive
position in the minds of target customers relative to competing products in the
market. Successful positioning includes communicating the benefits of the
product as well as communicating a unique selling proposition.
Many examples exist of businesses and their brands occupying a unique position
in the minds of their customers. Some are so successful that the brands have
become synonymous with the product category . For instance, one says Kleenex
to mean facial tissue, FedEx to mean shipping, or Xerox to mean photocopying.
Oral-B realized that if it wanted customers to change their toothbrushes rather
than keep using worn-out ones, the company needed to communicate this to the
customer . The company introduced a patented dye on the brush head that fades
with usage and indicates that it is time to get a new toothbrush. Lay’ s tries to
position itself on taste through its slogan of Betcha can’t eat just one , and
Volkswagen positions itself by focusing on driving pleasure with its tagline Drivers
wanted .
A brand can position itself based on a specific product attribute, or it can position
itself in comparison to a competitor ’s offering. Some automobile brands position
their vehicles using product attributes; for example, Honda and Toyota focus on
durability , reliability , and functional benefits while V olvo focuses on safety and
Volkswagen focuses on drivability . Other automobile brands position themselves
versus other brands, such as Hyundai against Toyota, to show that they of fer the
same or greater benefits.
We next discuss how segmentation has changed in a data-rich marketplace.
5.4 DATA-DRIVEN SEGMENTATION
As mentioned earlier , the higher volume of data available to businesses makes
the following types of segmentation feasible: segmentation based on behavioral
data, dynamic segmentation, and microsegmentation.
5.4.1 Behavioral Segmentation
In the world of Big Data, an abundance of information, including click-through and
search data, is available about people’ s behavior: which products they are buying,
where they are buying these products, how much they are paying, whether a
product is more likely to sell in specific packaging, and so on. Behavioral data can
be used to extrapolate demographic and psychographic information. Many times
it is dif ficult to find out the specific personality traits of consumers that result in
their purchasing a brand (e.g., is a customer more or less frugal?). However ,
behavioral data, even from social media, can be used to predict the general
personality of customers. Moreover , with the proliferation of online retailers, it has
become easy to conduct ongoing studies to figure out customer preferences.


Instead of trying to determine the segment of customers that is most likely to
purchase a brand by a study based on attitudes (e.g., how much do customers
like this brand?), a product can be introduced via small samples, and actual
purchase behavior can be monitored. Also, based on sales data, products can be
modified in real time based on which features customers most prefer . Hence,
data-driven markets allow a feedback loop by which businesses can observe
actual customer purchases and fine-tune market segments.
5.4.2 Dynamic Segmentation
Another outcome of rich data about customers allows a business to keep
updating its customer segments. Rather than segmenting all customers once and
assuming that their tastes are not going to change, dynamic segmentation
assumes that tastes will change and keeps updating what of fering would be best
preferred by a specific customer segment. Many aspects in an individual’ s life can
change. For example, a chocolate manufacturer cannot assume that just because
a customer has purchased dark chocolate in the past they will continue to do so.
Their personal, family , or health needs could change, causing them to move to
buying sugar-free or nut-free chocolates. Dynamic segmentation takes into
account the possibility that customer tastes change and, hence, that the segment
they belong to is not static. Again, it is important that businesses hone their ability
to sift through the wealth of information available to them and use the most recent
information, whether behavioral or otherwise, to segment customers.
5.4.3 Microsegments
As mentioned earlier , it has now become possible to cater to very small segments
of customers by understanding their preferences in depth and customizing
products accordingly . This also leads to hyperpersonalization, where each of fering
uniquely targets a specific customer based on both demographic and behavioral
data gathered about that customer . For instance, insurance companies can
augment existing data such as age, gender , and current product portfolio with
online behavior such as time spent on their website to better segment customers
and of fer the customer a very customized product.
As important as data are for segmentation, the algorithm chosen to perform the
segmentation is equally important. Many times we just have dif ferent types of data
about customers without information about a business outcome such as sales or
whether or not such a customer is loyal. That is, the data tend to be unlabeled.
Because we do not have any outcome labels, we do not have the ability to
compare model performances. The most common task of unsupervised learning
is exploratory analysis, which uses visualization methods (the simplest being
clustering) to examine the data and gather insights.
Let’s go over what algorithms are commonly used for segmentation.
5.5 CLUSTERING ALGORITHMS FOR
SEGMENTATION
Clustering is frequently used to segment customers into groups with similar need
sets. For instance, if we want to find out which of our customers are most likely to
recommend our product or our business, we can cluster them by similarity of
attributes and try to gather insights from the clusters formed. Clustering is the
process of grouping together data points that share some similarity , such that data
points within a cluster are more similar to one another as well as more dissimilar
to data points in a dif ferent cluster . Hence, clustering does exploratory data
analysis and is considered an unsupervised algorithm because it explores data
patterns rather than confirms a specific relationship. Clustering algorithms are
used when the data lacks labels.
Several clustering algorithms exist, such as k-means, k-nearest neighbors,
hierarchical and Gaussian mixture models, and so on; there are several types and
subtypes of clustering algorithms as depicted in Figure 5.1 . Clustering mainly
occurs either by partitioning a large set of observations into smaller sets or by
creating a treelike structure to depict the relationship between observations. In
clustering, the process of dividing is called partition clustering, and k-means, k-
nearest neighbors, and mixture models fall into this category . Clustering by
creating a treelike structure, also called a dendrogram, involves relating each
observation to another observation. Such hierarchical clustering can build up from
one observation, find the nearest next observation, and so on to create a tree
structure (agglomerative clustering), or it can begin by considering all
observations to be in one cluster and then break down the cluster using the
distance metric (divisive clustering).

We will use k-means, as well as a slight improvement— k-medoid—as clustering
methods for segmentation.
5.5.1 The Relationship Between Distance and
Similarity
The k-means algorithm is based on the intuitive notion that similar observations
are likely to be clustered together . The distance between observations is a way to
measure similarity: Less distance between observations implies that the
observations are likely to be similar , and more distance indicates dissimilar
observations. Thus, if the distance between two observations is less, it implies
that the observations are similar and can be clustered together within the same
cluster . If the distance between two observations is large, it implies that they are
dissimilar and probably cannot be clustered together .
We next discuss how distance is used as the metric to measure similarity of the
observations.
Let’s understand how distance is calculated between two observations. Assume
that the two observations are from two customers and that we have information
about two variables— age and income. W e can use these two variables to assess
the level of similarity between these two customers. If we call the two customers A
and B, then the two variables can be depicted as follows for customer A:
xA1=age,xA2=income
And for customer B:
xB1=age,xB2=income
The distance between two customers ( A→B) is calculated using the following
formula, which is also called the Euclidean distance formula.
distanceA→B=√(xA1−xB1)2+(xA2−xB2)2
We use the two dif ferent attributes x1 and x2 for both A and B to find the distance
between A and B. If we had information on a third customer , let’s say C, then we
could determine distance measures between customers A and B, B and C, and A
and C. Using this distance, we could state whether A was more similar to B or to
C since less distance indicates more similarity . Clustering algorithms utilize
distance as a way to group observations together . Observations that are more
similar are clustered together but separately from observations that are less
similar . We next discuss the most commonly used clustering algorithm, k-means.
5.5.2 The k-Means Algorithm
For any clustering algorithm, the goal is to find groups of similar observations
among all the observations in the given dataset. To accomplish this goal, the k-
means algorithm uses Euclidean distance to find out which observations are more
versus less similar . But this would become a very inef ficient task if we needed to
find distance estimates between each observation and every other observation.
Therefore, the first step in a k-means algorithm is to decide how many clusters
we, the user , want the algorithm to output. This is an issue with many clustering
algorithms, where the number of clusters has to be provided by the user , and the
algorithm accordingly clusters observations into the specified number of groups.
For instance, if we ask the algorithm to cluster 100 observations into 5 groups, it
will go ahead and do so, and if we ask it to cluster the same 100 observations into
20 groups, it will do that also. W e will discuss the issue of choosing the
appropriate number of clusters later .
We illustrate the steps of the k-means algorithm as follows:
1. Randomly select k points as initial centroids
2. repeat
3. Assign data points to the closest centroid
4. Recalculate the centroid of each cluster
5. until  Centroids do not change
Now let’ s visually understand these steps using a figure. Figure 5.2 (a) shows
observations, with each point representing a customer ’s age (x-axis) and income
(y-axis). W e set k=3, which means we want the algorithm to assign
observations to one of the three clusters. Once we provide the number of
clusters, the k-means algorithm randomly selects k locations as center points or
centroids . Figure 5.2 (b) shows these randomly selected centroids. The distance
from each observation to each of the k centroids is measured, and then each
observation is assigned to the centroid closest to it. At the end of the first iteration,
each observation has been assigned to one of the k clusters. The color of the
points in Figure 5.2 (b) indicates their cluster membership.

Figure 5.2  k-Means
The k-means algorithm next finds the new centroids of the newly formed k
clusters. Recall that a centroid is nothing but the central point of a cluster . Since
the initial centroids were randomly chosen, we can see that the location of the
new centroid changes (see Figure 5.3 (a)). Again, the distance of each
observation to these new k centroids is calculated, and the observations are
reassigned to the centroid closest to it.
Description
Figure 5.3  k-Means After Iteration
In this next iteration, k clusters are again formed. In the subsequent iteration,
centroids are calculated for these k clusters, and the process is repeated till the
centroids do not change (see Figure 5.3 (b)). The stability of the centroids
indicates that this is the optimal allocation of observations to k clusters. If we ask
for a dif ferent number of clusters, then the k-means algorithm will go through the
same process until it finds the optimal allocation of observations to the number of
clusters that we have specified.
5.5.3 The k-Medoid Algorithm
One of the issues with k-means is that outliers can influence the clusters that are
generated. An improvement over the k-means algorithm is k-medoid, which
modifies k-means to take care of this issue. While k-means randomly chooses
centroids of various clusters, k-medoid first chooses data points as centers of
clusters. Then instead of using Euclidean distance, it uses Manhattan distance to
find the closest cluster center to a point. Manhattan distance is calculated by
measuring the absolute distance between any two points and uses the following
formula:

By using Manhattan distance to calculate the proximity of a point to a cluster
center , k-medoid is less influenced by outliers and noise in the data.
An example of using k-means and k-medoid to segment customers will help us
understand how the algorithm can be used for segmentation.
5.5.4 Using k-Means to Segment Customers
We pick an example with just two variables because it is easy to visualize,
although k-means can be used for a large number of variables. (The data for this
example are hypothetical.) A common query of most retail stores is whether they
should target customers who spend more or customers who have been their
patrons for longer (i.e., is amount of money spent or duration more important?).
Therefore, we have two input variables: amount spent  and duration of patronage .
We first scale the data by subtracting the means and dividing by the standard
deviation (details of scaling and standardization are provided in the Technical
Appendix). Scaling the data prevents data distortions that would occur in
clustering if the input variables are on dif ferent scales; the variable with a bigger
unit would be overrepresented.
Then we tell the k-means algorithm how many clusters we want it to output. This
is an important consideration for most clustering algorithms, which require that the
user specify the number of clusters into which the observations need to be
segmented. Here we ask it to output three clusters. Figure 5.4  illustrates the three
clusters.

An important question (some even call it a challenge) in any clustering analysis is
knowing the best number of clusters to choose. Since we must specify the
number of clusters for the algorithm, how do we know whether three or seven will
be the best number of clusters? Many times it depends on the question we are
trying to answer . Or we can use past information that shows the number of
clusters obtained when we used similar data. A silhouette  helps us answer the
question of choosing the optimal number of clusters. A silhouette analysis is
based on the simple intuition that if an observation is in a cluster , then that
observation should be closer to those in the same cluster than to those in other
clusters. A silhouette coef ficient for each observation is calculated and varies
between −1 and +1, with +1 indicating the best and −1 being the worst allocation
to a cluster . The average silhouette coef ficient for all observations is known as the
average silhouette width . An average silhouette width near 1 indicates a tight
cluster , with observations in the cluster close together rather than spread all over .
For instance, if a four-cluster solution gives a silhouette value of 0.7, and a seven-
cluster solution gives a silhouette value of 0.3, it means that the four-cluster
solution is better .
Description
Figure 5.5  Silhouette Width: k-Means
In our case, we find that with a three-cluster solution the average silhouette width
is 0.61, as shown in Figure 5.5 . We can try dif ferent values of k and see how the
average silhouette width changes. W e can next run the same analysis using k-
medoid and instruct the algorithm to output three clusters (see Figure 5.6 ).
Description
Figure 5.6  k-Medoid Segmentation Plot
Description
Figure 5.7  Silhouette Width: k-Medoid
In this case we see that the average silhouette width using k-medoid is 0.62 (see
Figure 5.7 ) and not much dif ferent from a k-means solution. This could be


because there are not many outliers in the data. If the number of outliers
increased, the k-medoid would output a better solution.
Therefore, we can conclude our clustering analysis with the following insights.
When we want to perform segmentation, we can use a clustering algorithm such
k-means or k-medoid. W e use clustering because our data are unlabeled (i.e.,
they do not have an outcome label). In the example, we find that when amount
spent and patronage duration are used and we ask for three clusters, we can
obtain the average characteristics of customers in the three clusters. The
differences between these customers inform us how the business can present
effective product of ferings to customers in these three segments.
5.6 IMPLEMENTATION USING R: SEGMENTATION
USING K-MEANS AND K-MEDOID
To analyze and plot data, we will use two packages: cluster3 and
factoextra .4 After importing the data, we center and scale it using the
scale()  function with center = TRUE  and scale = TRUE  options; center
= TRUE  subtracts the column means of a variable from their corresponding
column values, and scale = TRUE  divides the (centered) columns of a variable
by their standard deviations. This process converts values of each variable into
their z scores. This is an important step before cluster analysis since each
variable of a dataset can be measured on dif ferent scales. In our dataset, for
example, duration of store patronage is measured in months, but amount spent is
measured in dollars. Scaling the data ensures that there are no distortions due to
difference in scales used across variables.
Once we have read and scaled the data (df) , the actual code to run k-means is
quite simple. In the kmeans()  function, centers specifies the number of clusters (
k), then nstart = 25  sets 25 initial random centroids and selects the best one.
A higher value of nstart  gives more stable solutions, but for larger datasets this
may end up taking more computing time.
library(cluster)
library(factoextra)
 
set.seed(12345) #Set seed for reproducibility
 
df <-  read.csv(url(
"http://data.mishra.us/files/chapter_segmentation/segmentation_kmeans.csv "))
 
df <- scale(df,center = TRUE, scale = TRUE)
 
k_means <- kmeans(df, centers = 3, nstart = 25)
The following code helps produce Figure 5.4  using fviz_cluster()  function.
repel = TRUE  prevents datapoints from lumping together and makes them
readable.
fviz_cluster(k_means, data = df,
 repel = TRUE,
 main = "k-means segmentation plot"
) 
We can also print cluster centers for each of the three clusters, as we saw in
Figure 5.4 . This is very helpful when our data have more than two variables and it
becomes harder to plot clusters. By using cluster centers, we can assess the
average characteristics of each cluster . Consistent with the plot, here our output
shows that members of cluster 1 have an average patronage duration of −1.009
months and have spent $1.383, whereas members of cluster 2 have a patronage
length of −1.006 months and have spent −$1.397. Due to centering and scaling,
amount spent and length have negative values. Cluster numbers might change in
different runs of the R code (e.g., cluster 1 may be labeled as cluster 2).
print(k_means$centers)
 
##length amount_spent
## 1−1.0092435 1.38324959
## 2−1.0058705 −1.39737047
## 30.7424104 0.00520243
Silhouette , a tool to detect the quality of clusters, can help in estimating the right
value of k. The silhouette coef ficient varies between −1 and +1. An average value
(also known as average silhouette width) near 1 shows a tight cluster , with
observations within a cluster close together compared to observations between
clusters. As the value moves away from +1 to −1, it indicates reduced within-
cluster cohesion.
The following code calculates distance and generates silhouette plots, as we saw
in Figure 5.5 . The dist()  function calculates the Euclidean distance between
points (method="euclidean") .
dis=dist(df, method="euclidean")
sil = silhouette (k_means$cluster, dis)
plot(sil,main=paste("K-Mean k = ", 3))
The silhouette plot shows that the average silhouette width is 0.58. W e can try
different values of k (or centers  in the k-means calculation) to see how the
average silhouette width changes.
The following code performs k-medoid clustering on the same data. There are
only two dif ferences in this code compared to the one that produces k-means.
First, instead of the k-means()  function, we use pam() , which stands for
“partitioning around medoids.” Second, for cluster analysis and calculation of
silhouette width, we use Manhattan distance. This produces the cluster plot and
silhouette width we saw in Figures 5.6  and 5.7.
k_medoid <- pam (scale(df), k = 3, metric = "manhattan")
 
fviz_cluster(k_medoid, data = df,
 repel = TRUE,
 main = "k-means segmentation plot"
)
 
dis=dist(df, method="manhattan")
sil = silhouette (k_medoid$clustering, dis) # for
silhouette plots
plot(sil, main=paste("K-Medoid k = ",3))
Since there are not many outliers, the results of k-means and k-medoid are very
similar .

10.1 FINANCIAL HEALTH OF A BUSINESS
In any firm, the finance department serves the important functions of control, planning, decision-making,
and ensuring regulatory compliance. The department provides a backward look at how the business
performed by examining many financial reports, including balance sheets, income statements, and cash
flow statements that indicate to the business where its strengths and weaknesses lie. It also provides an
important forward look in the form of many forecasts, including cash flow forecasts, scenario planning,
and sensitivity analysis. Forecasting (or prediction) models are very commonly used in finance to inform
lenders, the business itself, and several dif ferent types of investors where they need to invest their
resources in the coming time periods. These forecasts also consider credit ratings, market conditions,
and the broader economic outlook. Where should a business invest? Should it increase prices or of fer
promotions? Can it provide employee raises, or is it time to cut costs? Can it invest in a new location or
a new product? Financial management provides an overall look at the financial health of a firm, helping
in strategic decision-making across various departments. Therefore, financial forecasting helps provide
business leadership with an overall picture to develop strategies that avoid decision-making silos. Such
forecasting also helps lenders determine whether to of fer a loan and helps business borrowers
determine how much they should borrow .
10.2 IMPORTANCE OF FORECASTING FINANCIAL HEALTH OF
THE BUSINESS
Different entities in the firm need to determine the financial health of the business since it is a critical
input in their decisions. Owners and management need to know how the business is performing its main
functions to determine which areas need further investment versus which areas might need to be
divested. Incorrect forecasts or erroneously ambitious ventures can result in resources running out and
ventures having to be terminated midstream at great financial, organizational, and human cost. General
Electric started more than 100 years ago as an electric and electronic product manufacturing company
but was able to grow into many dif ferent areas—including GE Capital, a financial services branch.
However , after the financial crisis of 2008, regulatory pressures, and the unprofitable acquisition of
French transportation company Alstom’ s power business in 2015, GE had to divest its financial division
after management determined that further investment in this division would be problematic for GE’ s
other divisions.
Employees also need to be aware of their organization’ s financial health for a variety of reasons.
Knowledge of the company’ s financial standing helps in assessing job security and in making informed
career planning decisions. Awareness of organizational finances also fosters motivation and can align
individual objectives with the organization’ s goals. Transparent communication about financial health
also nurtures an environment of trust, facilitating better understanding of management decisions,
including those concerning incentives, compensation, and organizational changes.
10.2.1 The Influence of Borrowing on Financial Health
Determining financial health is important for a business so that it can understand whether it needs to
borrow money , how much to borrow , and at what interest rate; it also needs to identify which areas are
growth areas that merit further investment. Many businesses cannot operate without borrowing.
Borrowing helps grow the business, but it also adds costs in terms of interest payments. The interest
payable on debt provides a tax shield on the taxable amount. For instance, if the tax rate is 30% and the
interest expense is $1,000, then a business receives a tax shield of $300 (interest expense × tax rate).
In fact, trade-off theory  in finance suggests that there is a trade-of f between the tax shield provided by
debt and the financial distress of not being able to repay the debt. If we avoid the extremes, trade-of f
theory will predict that risky businesses focused on intangible assets, such as technology startups, will
have less debt compared to businesses that own tangible assets such as hotels. Companies want to
maintain an optimal debt ratio to ensure that lenders and investors don’t lose faith in them. Therefore,
one way to assess the value of a business is to consider its market value as dependent on its equity and
debt.
Market value = Equity + tax shield from debt – cost of financial distress
The trade-of f theory can be illustrated as shown in Figure 10.1 .
Description
Figure 10.1  Tax Shield Provided by Debt V ersus the Financial Distress
10.2.2 Debt Ratio and Borrowing Ability
As can be seen from Figure 10.1 , a business that operates just on equity and is not dependent on debt
is not influenced either by the tax shield or by the chance of financial distress because of debt. It can
face distress for other reasons but not because of its inability to pay back debt. Let’ s look at the curve
and the straight line. The curve shows a leveraged business—that is, one that has taken a loan and
owes a debt to its lenders. W e can see that initially , when the debt amount is low , the business gets a
tax shield for the debt. Given the low debt, the business may not be facing a huge amount of debt
servicing (i.e., paying back the principal and interest for each period of the loan). Please refer to Section
10.9: Glossary of Financial Terms for definitions. If the business goes to the market to borrow , the
lenders will use the debt ratio of the business to evaluate its financial health. A low debt ratio can help
the business borrow at a lower rate of interest. This reduced interest can help it grow and do well, which
in turn can increase its market value. The business can also borrow more. The more its debt increases,
the more its tax shield will grow initially . Everything is fine as long as the tax shield is able to of fset the
probability of financial distress because of the firm’ s debt servicing costs. However , the probability of
financial distress becomes quite high when the debt servicing crosses a threshold where the tax shield
is not able to match the level of borrowing. Borrowing beyond this point results in greater likelihood not
only of financial distress but also of bankruptcy .
Consider Sears, which declared bankruptcy after being in business for 125 years and having at one time
enjoyed the title of the largest retailer in the United States. Over the years, Sears accumulated
significant debt, which, coupled with operational inef ficiencies and strategic missteps, led to financial
distress. While debt can sometimes of fer leverage and tax shields, in Sears’ s case, it became a burden,
reducing its financial health. Sears tried to raise cash by closing hundreds of its stores as a cost-cutting
measure. This laid of f thousands of workers and caused distress to its employees. The inability to keep
up with the technological changes resulted in Sears slowly falling behind. Several post hoc theories
have been suggested for its demise, including lack of investment to modernize of fline stores and not
investing in a strong online presence. The demise of this previously formidable retailer shows that
knowing the financial health of a business and strategically basing its borrowing on its ability to pay of f
the debt in a timely manner is important for all company stakeholders.
10.3 IMPORTANCE OF KNOWING FINANCIAL HEALTH FOR
LENDERS
Lenders can be banks or any financial institution that lends money to businesses for dif ferent activities.
Lenders need to evaluate the financial health of a business before they determine whether to lend to a
business, ensuring that the business will remain solvent and pay of f its debt. Lenders need to
continuously evaluate the creditworthiness of the borrower over the period of the loan. Usually , a lender
evaluates the total assets of a business against its total liabilities, as stated in the balance sheet, to
determine its financial health. As we discuss in detail later , several financial and operating ratios are
used for this purpose. Businesses with good financial health are considered more creditworthy and are
likely to qualify for a loan, while businesses with poor financial health may be denied a loan or may
obtain it only at a significantly higher interest rate. A good credit rating—for example, a triple-A  rating—
allows a business to borrow from lenders at a lower rate. Conversely , a higher interest rate indicates that
the lender does not consider the business to be particularly creditworthy and is charging the higher rate
as insurance against the possibility that the business will default on its loan payment. In extreme cases,
as we discuss in Section 10.4.1 on private equity , a business in financial distress can borrow only at
very high interest rates.
It is not surprising that lenders take these precautions because businesses can start experiencing
financial dif ficulties through factors unfolding in their macroenvironment (e.g., the financial crisis of 2008)
or because of their own past decisions (e.g., GE deciding to buy Alstom or Toys “R” Us having
accumulated significant debt while facing increased competition from online retailers and changing
consumer preferences). When a business continues to experience financial dif ficulties, bankruptcy
looms as a possibility .
10.3.1 Poor Financial Health: Bankruptcy
If the business continues to experience financial dif ficulties, such as those we can see in Figure 10.1 , it
will start to default on its loan payments, resulting in increased financial distress. Such distress is a
cause of concern for lenders, who have to decide whether additional investment is warranted in an
attempt to reverse the distress or to allow further defaults by the business. In such cases, businesses
can declare bankruptcy . Bankruptcy is the legal acknowledgment by the business that it is unable to pay
off its debts. Businesses file for either Chapter 7  or Chapter 11 . In a Chapter 11  filing, a business can be
restructured in such a way that it gets another chance. If it subsequently does well, it can pay of f its
debts and work its way out of bankruptcy . For instance, Toys “R” Us filed for Chapter 11  in 2017, hoping
that it would be able to restructure the company and pay of f its debts. However , it was not able to do so
and had to file for Chapter 7  in 2018. Chapter 7  filing does not allow the business to continue to operate;
in such cases the business will cease to exist. One form of Chapter 7  bankruptcy occurs when all assets
of the business are liquidated so that some of its debts can be paid of f. In situations where the business
owners cannot pay back their debts, then the lenders step in and take over whatever is left of the
business.
There are numerous examples of companies that were successful at one time later experiencing
financial distress. For example, David’ s Bridal, a large wedding dress retailer with a presence in several
states, found that changing tastes and focus on nontraditional dresses by millennials resulted in lowered
profits and an inability to pay their debt. Mattress Firm filed for Chapter 11 , shutting down approximately
900 stores in 2018. It struggled with adapting to changes introduced in mattress manufacture and
competition from startups such as Tuft & Needle, Casper , and Purple. Online mattress purchases have
seen a huge spike, even though mattresses were touted as a product that consumers need to physically
feel and experience prior to purchase. This resulted in Mattress Firm needing to reconsider how it of fers
its product to consumers who no longer feel the need to try out a mattress before purchasing it.
All lenders do not face the same decision of whether to let a business file for bankruptcy . It depends on
the type of business. For example, consider lenders to two businesses: a restaurant versus a biotech
startup. Initially , both need the same level of investment from the lenders. If a few years later both
companies file for bankruptcy , the situation from the point of view of the lender will dif fer. In the case of
the restaurant, the entire setup is still functional, and an easy option for the lender is to get someone
else to run the restaurant. However , in the case of the biotech startup, the space or the setting is
unimportant; the investment is in human capital and what it can produce—the ideas and innovations that
are generated by the employees. If the biotech does not do well, then what can the lender salvage?
Unfortunately , not much.
10.4 IMPORTANCE OF KNOWING A BUSINESS’S FINANCIAL
HEALTH FOR INVESTORS
A business can have dif ferent types of investors. For instance, it might have venture capitalists investing
in it during the initial stage of development. In later stages, several financial institutions, including private
equity firms, may invest or buy stakes in the business. This allows them to have a say in the working of
the business—for example, which divisions to identify for growth versus divestment. Finally , if the
company is traded on the stock market, individual investors also are interested in knowing the financial
health of a business to determine whether and how much to invest in it. Depending on the level of
investment—for example, a financial institution investing millions versus an individual investor
purchasing one share of stock for a few dollars—investors can utilize dif ferent means to understand
whether and how much to invest. Again, the financial health of a business, assessed by using dif ferent
types of financial ratios, becomes the means to determine the level of investment. In certain
circumstances, when investors might assess that a business has potential but is not performing


optimally , they might buy a major stake to have a greater say in operations. Private equity is one such
type of investor . Private equity firms tend to invest in businesses that have unrealized potential but are
struggling financially , possibly because of high debt; make them grow rapidly; and—if (as predicted) the
business does have unrealized potential—reap the benefits.
Hence, it is important for the business, lenders, and investors to accurately identify whether a business
does have the potential to grow or whether the trajectory of financial distress is likely to continue. An
entire area in finance is devoted to understanding and predicting what variables can be used to predict
whether a business is going to experience financial distress or , in extreme cases, go bankrupt.
10.5 FORECASTING FINANCIAL HEALTH
Several predictors have been considered that can help predict creditworthiness. Let’ s understand this
using an example from the perspective of a lender such as a bank. When a business approaches a
bank asking for a loan, the bank is likely to utilize several criteria to first determine the financial health of
the business and then decide whether or not to give a loan. Let’ s assume that a bank wants to
determine variables that can help it assess the financial health of the business. Let’ s also assume that
the bank is being conservative in its estimate and defines creditworthiness in terms of future financial
distress or possibility of bankruptcy . It can focus on financial as well as nonfinancial predictors, but many
times lenders prefer to look at financial predictors to understand the financial health of a business.
10.5.1 Financial Ratios
Businesses report several financial ratios that help lenders evaluate their financial health, such as debt ‒
equity ratio, current ratio, earnings ratio, and operating ratio. These ratios are commonly available on
the balance sheet of a business’ s financial statements. Please see the detailed definitions of these
ratios in the glossary provided in Section 10.9  of this chapter .
For any type of forecasting, businesses tend to use a process of variable selection  to sort the relevant
from the irrelevant variables. If a business knows which variables are relevant, it can use only those
variables in its forecasting models. Another reason for variable selection is to improve the accuracy of
predictions; better predictions result in less costly mistakes. Similarly , when predicting financial health, it
is important to perform variable selection to find the relevant predictors to use in prediction models.
Moreover , many financial predictors tend to be correlated, some of them quite highly; this causes some
predictors to appear significant when they are not—that is, the presence of collinear predictors results in
incorrect predictions. Let’ s understand what multicollinearity is.
10.6 MULTICOLLINEARITY
Collinearity occurs when two predictor variables are highly correlated. Multicollinearity occurs when
several such variables are present in the dataset. Multicollinearity can occur for a variety of reasons in
business data, such as when predictors are dependent on the same underlying cause or when data
collection is observational. In our case, since financial ratios are based on financial indicators, the
likelihood of multicollinearity is high. Multicollinearity causes the following issues. First, when
multicollinearity exists in a regression model, it may not be appropriate to use ordinary least squares
(OLS) regression. This is because OLS assumes that the predictor variables are independent—that is,
uncorrelated (in fact, predictor variables are called independent variables  for this reason). The presence
of multicollinearity makes it dif ficult to interpret the coef ficient estimates of individual predictors. Recall
from Chapter 2  in which we discussed linear regression that we used beta coef ficients to determine
whether a predictor variable had a significant influence on the outcome variable. If several of the
predictors are highly correlated, the influence of a specific predictor on the outcome (e.g., significance
level) will change depending on which predictors are included in the regression model, resulting in
incorrect assessments from the analysis. Second, one of the assumptions of OLS is that we examine
the change in the outcome variable for a unit change in the predictor , holding all other predictors
constant. However , if two predictors are highly correlated, such an assumption would not be fulfilled.
Moreover , if our aim is to find which predictors are the most versus least influential, multicollinearity will
make the task dif ficult. Third, as the correlation among predictors increases, standard errors also
increase because it becomes dif ficult to determine whether the variation in the outcome is caused
because of predictor 1 or predictor 2. Therefore, the standard error of both predictors increases. High
incidents of standard error make it dif ficult to reject the null hypothesis even though the null may be
false. Therefore, the likelihood of Type I error increases (i.e., the inability to reject a false null
hypothesis). Finally , multicollinearity can result in an overfitted model because of the inclusion of two
predictors that are very similar in the way they relate to the output. An overfit model would be quite
inaccurate and poorly generalizable while making predictions on a new dataset. This occurs because
the model has learned spurious relations given the multicollinearity present in the original dataset that
may not be present in the new dataset on which the model is asked to predict. A bit needs to said about
the bias ‒ variance trade-of f to understand the problem caused by overfit models (please refer to the
Technical Appendix for a detailed discussion of the bias–variance trade-of f). When we have an overfit
model, the bias of the model is low because it fits the training data really well; however , the variance of
the model is high because it doesn’t predict well on the new data.
10.6.1 Testing for Multicollinearity
Given the possibility of multicollinearity occurring when using financial variables to determine the
financial health of a business, we need a method that can address multicollinearity as well as help in the
selection of variables. The first step is to have a method to detect whether a dataset has multicollinear
predictors. The simplest way to test for multicollinearity is by looking at the scatterplot between dif ferent
predictor variables. A linear relationship between any two predictors indicates a high degree of
correlation between them. Similarly , a correlation matrix between all the predictors would quantify the
level of correlation among the predictors. Large changes in beta coef ficient estimate values depending
on when one or the other predictor is or is not included in the regression could be another indication of
multicollinearity . For instance, if earnings ratio had a high coef ficient estimate value when current ratio
was not included but the coef ficient value was reduced significantly in magnitude when current ratio was
included in the regression, this would indicate a high correlation between earnings ratio and current
ratio.
Finally , the variance inflation factor (VIF)  is used to quantify the level of multicollinearity . VIF is a metric
that helps in determining inflated variance of the beta coef ficient for a specific predictor variable because
of multicollinearity with other predictor variables. Stated dif ferently , VIF tells us how much the variance
(the spread of predictor values) is inflated due to these correlations. Since VIFs capture the relationship
among predictor variables, the VIF is calculated by regressing each predictor against every other
predictor . Such a regression will provide an R2 value, which is then put into the following equation for
the ith predictor:
1/(1−R2
i)
As you may recall, R2 is the coef ficient of determination in an OLS regression model that informs us
how well the predictor(s) is(are) able to predict the outcome variable. In this case, R2 indicates how well
other predictors are able to predict the ith predictor .
Hence, we can calculate the value of VIF for each predictor variable. There are some cutof fs that help
us evaluate whether the correlation between the predictors is very high. For instance, a VIF of 1.7 for a
predictor indicates that the variance of that predictor ’s estimate is 1.7 times what it would have been in
the absence of multicollinearity . A VIF of 3.5 indicates 3.5 times more variation. A simple rule of thumb is
that VIF values of more than 5 indicate high multicollinearity .
One way to address multicollinearity is through the use of stepwise regression. However , this can get
computationally inef ficient. Hence, in this chapter we discuss the use of penalized regression, which
provides an ef ficient way to handle multicollinearity through variable selection.
10.7 USING PENALIZED REGRESSION FOR EVALUATING
FINANCIAL HEALTH
One type of regression that can address issues of multicollinearity is called penalized regression. It
introduces a penalty that penalizes the model for having too many predictor variables. Either the
predictors may be less relevant, or they may be correlated. Penalized models shrink the beta-coef ficient
estimates of the less relevant predictors so that they can either be removed or have very little impact in
predicting the outcome variable.
The functional/mathematical formulation of penalized regression allows it to work dif ferently than OLS
regression. For example, we use a set of predictor variables in the OLS model to predict an outcome.
We then compare the predicted value to the actual value (ground truth) to examine the quality of the
OLS model’ s predictions. If the dif ference is high, the quality is poor; if the dif ference is low , the quality is
good. Therefore, we try to minimize the dif ference between the actual and predicted values. As
explained earlier , one issue with multicollinearity is that it results in a model that is overfit; it explains the
training data well, but its predictions on test (i.e., new) data are quite poor .
Penalized regression addresses this situation by adding a shrinkage penalty to the beta-coef ficient
estimates of the predictors. The shrinkage penalty fits a new prediction model that introduces a small
amount of bias but greatly reduces the variance. With the addition of the shrinkage, the output intuitively
becomes less sensitive to changes in the value of the predictor; hence, there is less variance when the
model is used to make predictions on a new dataset. For the purposes of this chapter , we will focus on a
specific type of penalized regression—LASSO (Least Absolute Shrinkage and Selection Operator)1—
which not only helps to address multicollinearity but also allows for variable selection. The other form of
penalized regression is ridge regression, which does not help in variable selection. Specifically , the
penalty term used in the LASSO helps shrink the coef ficient estimates of the less important predictors to
zero. When the beta coef ficients of some predictor variables have been shrunk to zero, they are no
longer included in the prediction model. Hence, this process serves as a variable selection method for
LASSO.
Let’s assume that we have i = 1 to n observations and j = 1 to p predictors and their corresponding beta
coefficients.
Linear regression minimizes the dif ference between the observed outcome values and predicted
outcome values as captured in the following equation:

When λ = 0, LASSO converts to OLS. As the value of λ increases, the penalty increases, and the value
of the coef ficient estimates shrinks to zero. That is, λ controls the value of the penalty that is applied to
the regression. The value of λ can vary from 0 to positive infinity .
Another intuitive way to think about the shrinkage penalty is to think of c(β) as the cost applied by
penalized regression on the size of the β coef ficients. β coef ficients determine how much the estimated
outcome values deviate from the observed values (i.e., the deviance between the data and the model).
Adding a penalty on the size of the β coef ficients and forcing them to be near zero improves prediction.
LASSO is especially useful when a model includes several predictor variables and the business is not
able to decide which of these are relevant and which are not. Consider a grocery store with outlets
across several geographic regions. There are many predictors that can af fect the sale of fresh baked
goods, including the presence of local bakeries, the cost of eggs (which could change by region), the
cost of milk, the cost of transportation, the nearness of farms, population density around a specific store,
income level, regionally popular flavors—and the list can keep going. Which of these are the most
important predictors of sales for a specific store? By using LASSO for variable selection, the grocery
store can determine which sales predictors are important and can focus its resources on these relevant
predictors. LASSO can also solve the problem of one form of Big Data—when there are more predictors
than observations. In such an instance, OLS regression will not converge because it needs at least as
many observations as predictors. If the data have two predictors, then the OLS needs at least two
observations or data points to converge (provide a solution). In instances when firms are not sure about
which predictors are most relevant, they may include tens of predictors and would need at least as many
observations for the OLS to work.
Let’s use a specific example to understand how LASSO can help in predicting the financial health of
businesses from the perspective of a lender .
10.7.1 Predicting Financial Health Using LASSO
Let’s consider the example of Altra Bank, a made-up example for the purposes of this chapter that lends
to several businesses and, hence, needs to know the financial health of each so that it can determine
whether the business will be able to pay back the debt amount or whether it is likely to default on its
payments. Having information about the financial health of a business allows Altra Bank to decide
whether to give a loan and how much interest to charge. During its more than 50 years in this business,
Altra Bank has determined that the financial health of a business rarely changes overnight and that any
changes for the worse can be detected through certain predictors. Moreover , Altra Bank has observed
that the financial ratios of a business, as calculated from the balance sheet, are good predictors of
financial health.
In the past, Altra Bank has used these financial ratios to find out which businesses it has lent to need to


be monitored more closely . However , recently it has learned that ratios including operating variables
such as sales are also worth considering when forecasting the financial health of a business. Therefore,
it obtained data containing 16 dif ferent ratios for 665 businesses that have good versus poor financial
health. The metric in the data for assessing financial health is whether a business has or has not gone
bankrupt. The data contain information on several financial ratios such as debt–equity ratio, current
ratio, and operating ratio for businesses that did or did not go bankrupt. Similar to other lenders, Altra
Bank also uses data on these ratios to build a model that can help it make predictions about the
financial health of the businesses it is determining whether to lend to or not. Altra Bank also wants to
determine whether some ratios are better predictors than others; hence, having data with labels of
whether a business went bankrupt is very useful in building the model. (The data used in this example
are hypothetical.)
The data have the following 16 financial ratios, some of which are operational ratios, marketing ratios, or
accounting ratios.

earning_ratio_1 = EBIT  (earnings before interest and taxes) / total assets
debt_equity_ratio_1 = book value of equity / total liabilities
accounting_ratio_1 = total assets / total liabilities

operating_ratio_3 = profit on operating activities / sales
current_ratio_4 = (current assets − inventory) / short-term liabilities

[profit on operating activities − depreciation] / total assets)
current_ratio_5 = current assets / total liabilities
debt_equity_ratio_2 = long-term liabilities / equity
operating_ratio_4 = total costs / total sales

We next define the outcome variable: yes, a business will go bankrupt  versus no, a business will not go

Since the outcome is binary , we will use the AUC ROC (area under the curve receiver operating
characteristics) curve to examine the quality of predictions of the LASSO model. AUC is the ratio
between a false positive (firms that did not go bankrupt but are identified by the model as having gone
bankrupt) and a true positive (firms that went bankrupt and are identified by the model as having gone
bankrupt). Higher values of AUC are better because they indicate whether the model is able to
distinguish between the yes and no outcomes. AUC = 1 indicates that the model is able to correctly
classify yes as yes and no as no. AUC = 0.8 means that 80% of the time the model will classify yes and
no correctly . AUC = 0.5 means that the model cannot distinguish between yes and no and is considered
random in its predictions. AUC = 0 means that the model is reversing its predictions completely and
classifying yes as no and no as yes.

10.7.2 Business Insights and Other Applications
Therefore, using a penalized regression model, we can build predictive models even if the data are
collinear—a common problem when using financial ratios as predictors. Note that linear and logistic
regression’ s estimates are af fected by the presence of multicollinearity—resulting, for example, in the
model’ s inability to reject a false null hypothesis. However , penalized regression can provide estimates
even in the presence of multicollinearity . It handles correlation among predictors through the inclusion of
the shrinkage penalty that helps find the model of best fit even in the presence of multicollinearity . In
terms of business insights, using LASSO, in this chapter we developed a penalized regression model
that can help lenders allocate loans and businesses determine their financial health.
In addition to selecting which variables are the most important to determine the financial health of an
organization, LASSO can be used in other areas of finance such as assets optimization by selecting the
critical assets that can result in an optimal asset portfolio. It can also be used for fraud detection in
financial transactions—by finding the variables that help financial organizations identify which
transactions do not appear regular and could, hence, be fraudulent. Moving beyond the financial sector ,
LASSO can be used to identify the most important variables to predict employee satisfaction or for
optimal inventory management or ef fective campaigns that maximize customer engagement.

To examine the quality of predictions of the LASSO model, we look at the AUC ROC curve. AUC is the

10.9 APPENDIX: GLOSSARY OF FINANCIAL TERMS
Balance Sheets:  Financial statements that provide an overview of a company’ s assets, liabilities,
and shareholders’  equity at a certain point in time.
Bankruptcy:  A legal process in which a person or business declares the inability to repay
outstanding debts. It can of fer some protection from creditors and provide a way to reorganize or
liquidate assets.
Borrow Money:  To obtain funds from a lender with the promise of repaying it in the future, usually
with interest. The person borrowing money is also called a debtor .
Chapter 7:  A type of bankruptcy under U.S. Bankruptcy Code that involves the liquidation or selling
of a debtor ’s nonexempt assets to pay of f creditors.
Chapter 11:  A type of bankruptcy under U.S. Bankruptcy Code that allows businesses to continue
operating while they restructure their debt obligations and business af fairs and plan for the future
under the guidance of the bankruptcy court.
Credit Ratings:  A rating given to a business or individual that indicates their creditworthiness or
ability to repay borrowed funds. One credit rating agency is Standard and Poor ’s (S&P).
Current Ratio:  This ratio considers the relationship between current assets (the assets that can be
easily converted into cash, such as inventory) and current liabilities (e.g., short-term debts, dividend
payments, and taxes). It is a measure of the liquidity  of a business (defined as the ease with which
an asset can be converted into cash without af fecting its market value). Current ratio helps lenders
determine how equipped the business is in terms of repaying its debts, especially its short-term
debt payments. A higher current ratio (current assets to current liabilities) indicates higher liquidity . A
current ratio of 2 is said to indicate sound financial health, while anything less than 1 can constitute
a warning sign.
Debt–Equity Ratio:  This ratio evaluates the relationship between liabilities of the business (what it
owes; specifically long-term debts, which appear on the right side of the balance sheet) and
shareholder equity (total assets minus total liabilities). It is one of the most common ratios used to
evaluate the health of a business. What is considered a good debt–equity ratio depends on the
industry—values nearer 1 are generally considered better . As the value of the debt–equity ratio
increases beyond 1, it indicates that the business is more dependent on debt financing than on its
own equity . Problems arise when the reliance on debt keeps increasing, meaning the likelihood of
financial distress increases.
Debt Ratio:  A financial metric that compares a company’ s total debt to its total assets, used to
evaluate financial risk.
Debt Servicing:  The process of making principal and interest payments on borrowed funds over
time.
Default:  Failure to fulfill the repayment of a loan, including interest or principal, at the agreed-upon
terms and time.
Earnings ratio:  This ratio is the current earnings of a firm and captures the financial performance
of a business before taking into account taxes and other liabilities. It allows investors to look at how
the business is performing every year because of the operating decisions made for that year; it
does not take into account financial decisions that carry over from previous years such as interest
and taxes. Thus, it provides a good picture of a business’ s net income or profit in a given year .
Economic Outlook:  An analysis or opinion regarding the future state of the economy or economic
conditions.
Equity:  The value of ownership interest in a business, calculated by deducting liabilities from
assets.
Financial Distress:  A condition in which a company faces dif ficulties in meeting its financial
obligations, such as paying of f debt.
Financial Health:  The overall economic status of a business, including its income, expenses,
debts, and long-term sustainability .
Financial and Operating Ratios:  Metrics used to evaluate a business’ s financial health and
operational ef ficiency .
Growth Areas:  Parts or aspects of a business showing potential for expansion or development.

## 5.1 PHÂN KHÚC KHÁCH HÀNG (SEGMENTING CUSTOMERS)

Vegan-Always là một nhà hàng mới mở ở Phoenix. Họ muốn gửi phiếu giảm giá (coupons) cho những khách hàng yêu thích đồ chay. Họ có nên gửi những phiếu giảm giá này cho tất cả cư dân của Phoenix không? Mặc dù có thể làm được, nhưng việc phân phối phiếu giảm giá rộng rãi như vậy không chỉ trở nên rất tốn kém mà không phải ai cũng sẽ quan tâm đến các món ăn của nhà hàng. Vì không phải tất cả khách hàng đều giống nhau hoặc có cùng sở thích, việc gửi cùng một thông điệp tiếp thị đến tất cả mọi người là không hiệu quả hoặc sinh lời. Chiến lược tốt nhất cho Vegan-Always là chia toàn bộ dân số Phoenix theo cách mà họ chỉ gửi phiếu giảm giá cho những người có khả năng sẽ ghé thăm nhà hàng. Một cách nhà hàng có thể làm điều này là sử dụng các yếu tố tâm lý học (psychographics) hoặc lối sống (lifestyle). Những người quan tâm nhiều hơn đến môi trường đã chuyển sang ăn chay và có thể sẽ quan tâm hơn đến một nhà hàng như vậy.

Tương tự, nhân khẩu học (demographics) có thể là một cách khác để tìm các nhóm khách hàng phù hợp với nhà hàng. Quá trình chia thị trường thành các nhóm khách hàng có các đặc điểm tương đồng và chọn (các) nhóm phù hợp nhất để doanh nghiệp nhắm mục tiêu (target) được gọi là phân khúc thị trường (market segmentation).

Một cách để hình dung về phân khúc là xem nó như một sự thỏa hiệp giữa tiếp thị đại chúng (mass marketing - giả định rằng tất cả khách hàng đều giống nhau) và tùy chỉnh ở cấp độ cá nhân (individual-level customization - giả định rằng tất cả khách hàng đều là duy nhất). Thay vì nhắm mục tiêu vào từng khách hàng, việc phân khúc cho phép doanh nghiệp nhắm mục tiêu vào các nhóm khách hàng tương tự nhau trong cách họ phản hồi với sản phẩm. Trong các thị trường dựa trên dữ liệu (data-driven markets) hiện nay, việc phân khúc ở mức độ sâu hơn đã trở nên khả thi; do đó, vi phân khúc (microsegmenting) đang trở nên phổ biến. Ví dụ, dựa trên hành vi mua hàng trong quá khứ và sự tương đồng với các khách hàng khác, Amazon có khả năng tạo ra các vi phân khúc (microsegments) và đề xuất các sản phẩm rất cụ thể cho từng khách hàng của mình.

Bước đầu tiên trong phân khúc thị trường (market segmentation) là hiểu lý do tại sao khách hàng mua một sản phẩm. Sản phẩm đó mang lại những lợi ích gì mà khách hàng có thể quan tâm? Doanh nghiệp cần xác định tất cả các nhu cầu của khách hàng mà một sản phẩm hoặc dịch vụ có thể đáp ứng.


Thay vì cố gắng xác định phân khúc khách hàng có khả năng mua một thương hiệu nhất bằng một nghiên cứu dựa trên thái độ (ví dụ: khách hàng thích thương hiệu này đến mức nào?), một sản phẩm có thể được giới thiệu thông qua các mẫu nhỏ và hành vi mua hàng thực tế có thể được theo dõi. Ngoài ra, dựa trên dữ liệu bán hàng, các sản phẩm có thể được sửa đổi trong thời gian thực (real-time) dựa trên các tính năng mà khách hàng ưa thích nhất. Do đó, các thị trường dựa trên dữ liệu (data-driven markets) cho phép một vòng phản hồi (feedback loop) mà qua đó các doanh nghiệp có thể quan sát hoạt động mua hàng thực tế của khách hàng và tinh chỉnh các phân khúc thị trường (market segments).

### 5.4.2 Phân khúc Động (Dynamic Segmentation)
Một kết quả khác của dữ liệu phong phú về khách hàng cho phép doanh nghiệp liên tục cập nhật các phân khúc khách hàng của mình. Thay vì phân khúc tất cả khách hàng một lần và cho rằng sở thích của họ sẽ không thay đổi, phân khúc động (dynamic segmentation) giả định rằng sở thích sẽ thay đổi và liên tục cập nhật xem dịch vụ/sản phẩm nào sẽ được một phân khúc khách hàng cụ thể ưa thích nhất. Nhiều khía cạnh trong cuộc sống của một cá nhân có thể thay đổi. Ví dụ, một nhà sản xuất sô cô la không thể cho rằng chỉ vì một khách hàng đã mua sô cô la đen trong quá khứ thì họ sẽ tiếp tục làm như vậy. Nhu cầu cá nhân, gia đình hoặc sức khỏe của họ có thể thay đổi, khiến họ chuyển sang mua sô cô la không đường hoặc không có hạt. Phân khúc động tính đến khả năng sở thích của khách hàng thay đổi và do đó, phân khúc mà họ thuộc về không phải là tĩnh (static). Một lần nữa, điều quan trọng là các doanh nghiệp phải trau dồi khả năng sàng lọc qua lượng thông tin dồi dào có sẵn cho họ và sử dụng thông tin gần đây nhất, cho dù là hành vi hay thông tin khác, để phân khúc khách hàng.

### 5.4.3 Vi phân khúc (Microsegments)
Như đã đề cập trước đó, hiện nay đã có thể phục vụ các phân khúc khách hàng rất nhỏ bằng cách hiểu sâu sắc sở thích của họ và tùy chỉnh các sản phẩm cho phù hợp. Điều này cũng dẫn đến siêu cá nhân hóa (hyperpersonalization), nơi mỗi dịch vụ/sản phẩm nhắm mục tiêu duy nhất đến một khách hàng cụ thể dựa trên cả dữ liệu nhân khẩu học (demographic data) và dữ liệu hành vi (behavioral data) được thu thập về khách hàng đó. Chẳng hạn, các công ty bảo hiểm có thể bổ sung dữ liệu hiện có như tuổi, giới tính và danh mục sản phẩm hiện tại bằng hành vi trực tuyến như thời gian truy cập trên trang web của họ để phân khúc khách hàng tốt hơn và cung cấp cho khách hàng một sản phẩm được tùy chỉnh cao.

Việc chọn thuật toán để thực hiện phân khúc cũng quan trọng không kém gì dữ liệu dành cho phân khúc. Nhiều lần chúng ta chỉ có các loại dữ liệu khác nhau về khách hàng mà không có thông tin về kết quả kinh doanh như doanh số bán hàng hoặc khách hàng đó có trung thành hay không. Tức là, dữ liệu có xu hướng không được gán nhãn (unlabeled). Bởi vì chúng ta không có bất kỳ nhãn kết quả nào, chúng ta không có khả năng so sánh hiệu suất của mô hình. Nhiệm vụ phổ biến nhất của học không giám sát (unsupervised learning) là phân tích khám phá (exploratory analysis), sử dụng các phương pháp trực quan hóa (đơn giản nhất là phân cụm - clustering) để kiểm tra dữ liệu và thu thập thông tin chi tiết.
