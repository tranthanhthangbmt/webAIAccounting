6.2	 Ad-Click Fraud Detection in the Banking 
and Financial Sectors
Ad-click fraud detection is a critical aspect of safeguarding the integrity 
and efficiency of online advertising ecosystems. Advertisers invest sub­
stantial resources in digital campaigns to reach their target audience, mak­
ing them susceptible to fraudulent activities that compromise the return 
on investment. Ad-click fraud entails the deceptive manipulation of clicks 
on online advertisements, often orchestrated by automated bots or indi­
viduals aiming to exploit the pay-per-click (PPC) model. In order to coun­
teract this threat, advanced AI solutions are essential [18]. ML algorithms 
meticulously analyze extensive datasets, examining user behavior patterns, 
click-through rates, and engagement metrics to pinpoint anomalies indic­
ative of fraudulent activities. AI models employ real-time monitoring to 
identify abrupt spikes in click volume or unusual geographic patterns. The 
ongoing evolution of these detection mechanisms ensures the dynamic 
and adaptive nature of ad-click fraud prevention, providing advertisers 
with a robust defense against deceptive practices and fostering a more 
trustworthy digital advertising environment [19].
6.2.1	 Definition and Types of Ad-Click Fraud
Ad-click fraud is the dishonest activity of creating fake clicks on inter­
net ads with the intention of manipulating advertising analytics or taking 
advantage of the PPC income model. Executed by either automated bots 
or individuals, this fraudulent activity endeavors to artificially inflate click 
counts, exhaust advertiser budgets, and undermine the effectiveness of 
digital advertising campaigns [20]. This form of fraud presents a substan­
tial challenge to the online advertising ecosystem, affecting advertisers, 
publishers, and ad networks alike.
Varieties of Ad-Click Fraud:
Automated Bots:
Definition: Automated bots, or scripts, are programmed to sim­
ulate human behavior by interacting with ads. Deployed in 
significant numbers, these bots generate a considerable vol­
ume of deceptive clicks.

Challenges in Detection: Bots are evolving in sophistication, 
posing difficulties in distinguishing between legitimate and 
automated clicks.
Click Farms:
Definition: Click farms employ groups of individuals, often 
in regions with lower labor costs, to manually click on ads. 
These operations can be structured to produce large quanti­
ties of fraudulent clicks.
Challenges in Detection: Identifying click farms involves ana­
lyzing click behavior patterns and IP addresses, with the 
additional complexity that these operations often go to great 
lengths to appear authentic.
Competitor Clicks:
Definition: Competitors may engage in click fraud to exhaust a 
rival’s advertising budget, diminish campaign effectiveness, 
or gain a competitive advantage.
Challenges in Detection: Distinguishing between genuine user 
interest and competitive interference is intricate, requiring 
advanced analytics.
Fraudulent Publishers:
Definition: Unscrupulous publishers may click on ads on their 
own websites to falsely boost revenue.
Challenges in Detection: Identifying collusion between pub­
lishers and fraudulent clicks involves scrutinizing traffic pat­
terns and engagement metrics.
Ad Stacking:
Definition: Ad stacking happens when multiple ads are layered 
in a single ad placement. While users may only see the top 
ad, all ads in the stack register as clicks.
Challenges in Detection: Detecting ad stacking necessitates ana­
lyzing click-through rates and user engagement to uncover 
discrepancies.

6.3	 Credit Card Management Fraud Detection
Detecting credit card management fraud is a crucial aspect of ensuring 
financial security in today’s digital age. The increasing prevalence of online 
transactions and the continuous expansion of the e-commerce landscape

evolving fraud tactics, crucial in an environment where fraudsters contin­

a reference point to flag any deviations, whether it involves a sudden surge 
in transaction frequency or a shift in spending habits [27].

fraud detection also prioritizes minimizing false positives. AI and ML 
algorithms are consistently improving in this aspect, empowering finan­
cial institutions to reduce the number of legitimate transactions mistak­
enly flagged as fraudulent. This not only enhances the user experience for 
cardholders but also maintains a robust defense against fraud [28]. In the 
modern financial landscape, credit card management fraud detection pow­

6.4	 Document Dispensation Fraud Detection 
in E-Commerce Transactions
Fraud through document manipulation in e-commerce transactions poses 
a multifaceted challenge, carrying potential financial and legal ramifica­
tions. This deceptive practice involves altering or fabricating documents 
such as invoices, receipts, shipping orders, or other transaction-related 
paperwork to deceive e-commerce platforms, retailers, or financial insti­
tutions. Effectively identifying document dispensation fraud demands the 
integration of advanced technological solutions and human oversight [34]. 
Natural language processing (NLP) techniques are essential for examin­
ing the textual content of documents in addition to AI and ML. They can 
reveal linguistic inconsistencies or abnormalities that might point to fraud. 
For instance, NLP approaches might reveal errors in product descriptions 
or in the wording or layout of invoices. Despite the use of technology in 
detecting document dispensation fraud, human interaction is still essential 
[35].
Human reviewers give the required context and judgment to make 
decisions about document authenticity, assisted by insights from AI and 
ML technologies. When abnormalities are found, they can also carry out 
in-depth investigations, looking at transaction histories and related data to 
help them decide whether the document is legitimate [36]. Detecting doc­
ument dispensation fraud in e-commerce transactions is a complex and 
interdisciplinary process. It requires the synergy of AI and ML algorithms 
for image and text analysis, combined with human expertise to make 
nuanced decisions based on context and experience. This collaborative 
approach ensures a robust defense against fraudulent document manipu­
lation, preserving the integrity of e-commerce transactions and upholding 
the trust and security of online retail ecosystems [37].

complexity of fraud detection models, enabling them to identify intricate 
patterns and anomalies [62].
AI and ML advancements have ushered in the era of predictive analytics 
because these models can now forecast potential fraud patterns based on 
historical data, allowing financial institutions to proactively prevent fraud­
ulent activities. Predictive models can identify outliers, detect anomalies, 
and trigger alerts for further investigation, reducing false positives and 
enhancing the overall efficiency of fraud detection [63].

The introduction of explainable AI and transparent decision-making 
is another noteworthy development. As AI and ML models have become 
more complex, the need for clear explanations for their decisions has 
grown. Interpretability in AI models is vital not only for building trust 
but also for compliance with regulatory and ethical standards [64]. As a 
result, models are now designed to provide comprehensible explanations 
for their fraud detection decisions, allowing financial institutions to under­
stand and audit their operations more effectively. The ongoing refinement 
of algorithms, the incorporation of big data and cloud computing, and the 
integration of behavioral analytics and biometrics will continue to drive 
innovation in the industry [65].
6.7.1	 Blockchain and Distributed Ledger Technology
Blockchain and distributed ledger technology (DLT) are assuming an 
increasingly pivotal role in fraud detection within the banking and finan­
cial industry. These technologies present an immutable, transparent, and 
decentralized approach to record-keeping, making it exceptionally ardu­
ous for fraudsters to manipulate transaction data. By furnishing a secure 
and tamper-resistant ledger, blockchain and DLT significantly augment 
the integrity of financial transactions [66]. The incorporation of smart 
contracts, a feature of blockchain, allows for the automation of fraud 
prevention measures and an enhancement of transaction security. While 
blockchain and DLT do not serve as standalone solutions, they comple­
ment AI and ML techniques by furnishing a robust and trustworthy foun­
dation for fraud detection and prevention in the financial sector [67].
6.7.2	 Explainable AI for Fraud Detection
Explainable AI is gaining traction in the realm of fraud detection within 
the banking and financial industry. As AI and ML models become more 
intricate, there is an escalating demand to comprehend and interpret the 
underlying logic behind their decisions [68]. Explainable AI delivers trans­
parent and understandable explanations for these decisions, empowering 
financial institutions to not only identify fraud but also comprehend the 
reasons why specific transactions are identified as fraudulent. This transpar­
ency plays a crucial role in fostering trust, ensuring regulatory compliance, 
and addressing concerns related to bias and discrimination. Explainable 
AI enhances the efficacy of fraud detection by facilitating human oversight 
and enabling more informed decision-making [69].

6.8	 Challenges and Risks
Implementing AI and ML for fraud detection in the banking and financial 
industry presents several challenges and risks. One major challenge is the 
constantly evolving nature of fraud tactics. Fraudsters continuously adapt 
and develop new techniques, making it necessary for AI and ML models to 
keep pace [70]. Staying ahead of emerging threats requires ongoing model 
refinement and the ability to detect novel fraud patterns. AI and ML mod­
els, while highly accurate, are not infallible, and misclassifying legitimate 
transactions as fraudulent or failing to identify actual fraud can lead to 
financial losses and customer dissatisfaction [71].
Biasness in AI model biased training data can result in discriminatory 
or unfair outcomes, disproportionately affecting certain groups. Ensuring 
fairness in AI is essential, and addressing bias through data preprocess­
ing and model calibration is crucial. Data privacy is an ongoing concern 
[72]. Handling sensitive customer information and transaction data neces­
sitates robust privacy and security measures to protect against breaches 
or unauthorized access. Ensuring that data are used in a compliant and 
ethical manner is a priority. Explainability and transparency are crucial. 
Understanding how AI and ML models arrive at their decisions is essential 
for building trust. The “black-box” nature of some models can be a barrier, 
and financial institutions must invest in techniques that allow for model 
interpretability and auditability [73].
6.8.1	 Model Robustness and Adversarial Attacks
The banking industry must ensure the resilience of AI and ML models 
for fraud detection, and potential adversarial assaults must be given top 
priority. Adversarial attacks intentionally alter data or input to deceive the 
model, resulting in incorrect classifications and possible security breaches 
[74]. Continuous testing and validation are necessary to identify weak­
nesses and reinforce AI models against such attacks. This entails creating 
systems that can survive malicious input while also continuously improv­
ing fraud detection algorithms to fend off new dangers. The cornerstone of 
protecting the financial sector from fraud is model robustness, which also 
supports the dependability and credibility of AI and ML systems [75].
6.8.2	 Scalability and Computational Resources
The potential of AI and ML models to detect fraud on a large scale offers 
both benefits and challenges. To support real-time fraud detection, there

is an increasing requirement for computational resources and processing 
power as transaction volumes rise. Making significant infrastructure and 
computational resource investments is necessary to solve this scaling prob­
lem [76]. It is essential to speed up and optimize models for efficiency in 
order to handle the growing data flow. The scalability of AI and ML systems 
is another important opportunity. Scaling makes it possible to accommo­
date more information and complexity, which can improve the precision 
and potency of fraud detection. This potential for scaling results in the 
creation of more reliable and adaptable models that can address new fraud 
trends in the ever-changing financial industry [77].
6.8.3	 Evolving Nature of Fraud
Systems for detecting fraud have a perpetual challenge since the fraud 
landscape is constantly changing [78]. Fraudsters continuously refine their 
tactics, employing increasingly sophisticated methods to exploit vulnera­
bilities in the financial system [79, 80]. Ranging from conventional credit 
card fraud to more intricate forms such as identity theft and document 
manipulation, fraud manifests in diverse guises. The advent of digital plat­
forms and e-commerce has furnished fraudsters with new avenues for 
deception [81]. To counteract this, AI and ML models must maintain a 
dynamic nature, adapting to identify emerging fraud patterns and remain­
ing proactive in staying ahead of evolving threats within the perpetually 
changing landscape of financial fraud [82].
6.9	 Conclusion and Future Scope
The application of AI and ML in fraud detection within the banking and 
financial industry represents a significant advancement in bolstering secu­
rity and operational efficiency. These technologies have proven invaluable 
for identifying and mitigating fraudulent activities, allowing financial insti­
tutions to respond promptly to emerging threats in real time. Nonetheless, 
this progress comes with its set of challenges. Adapting continuously to 
evolving fraud tactics, mitigating potential risks such as bias and adversar­
ial attacks, and strictly adhering to a dynamic legal and regulatory land­
scape are imperative for the responsible and effective use of AI and ML in 
this domain. AI and ML models are poised for a promising future in the 
field of fraud detection. The rapid evolution of technology is likely to result 
in more advanced and adaptive systems capable of not only identifying 
known fraud patterns but also proactively anticipating emerging threats.

Abstract
Financial fraud has a profound and far-reaching effect on the people. Financial 
institutions have the technical capacity to identify fraud using clever artificial intel­
ligence systems. Nevertheless, the duration needed to gather a significant amount 
of deceptive data to train their fraud detection algorithms poses an expensive haz­
ard. The industry faces security challenges such as infringements on intellectual 
property rights, harmful or discriminatory content creation, and data breaches. 
Financial institutions should use generative artificial intelligence systems inside 
secure and isolated networks to mitigate these possible risks. Furthermore, it is 
crucial to guarantee the utilization of specific training data, implement thorough 
security protocols, provide staff training initiatives, and actively supervise the 
produced output. Establishing governance structures, using anomaly detection 
technologies, incorporating external data sources, and validating the generated 
information are highly encouraged. Hence, it is recommended to form alliances 
with trustworthy suppliers and actively participate in cooperative initiatives 
with regulatory bodies and industry associations to enhance security protocols. 
Furthermore, mitigating the possible financial fraud and manipulation hazards is 
crucial by implementing robust governance frameworks, utilizing advanced algo­

AI has come to play an integral role in many phases of the
financial ecosystem from managing assets to accessing risks.
The present and future applications include AI algorithmic
trading, robo-advisor, chatbots, fraud detection, and loan/
insurance underwriting.
AI Algorithmic Trading
Algorithmic/quantitative trading has been used by hedge funds
or other financial institutions since the 1970s. Today, AI has
become the new emerging trend in the asset management
landscape. Unlike traditional trading algorithms that were built
to exploit specific market opportunities such as identifying the
trend of price movement, AI has the power to truly act as an
independent agent participating in market action.
Big data and various forms of artificial intelligence, such as
ML and NLP, have changed the asset management industry.
Using NLP tools, the machine can analyze the company’s
revenue calls to detect changes in management sentiment that
may signal future performance and screen through the analyst
report to indicate terms that are about to change its headline
forecast. These tools can also be used to analyze a large number


--- Page 366 ---

of unstructured data sources (such as news reports, blogs, and
social media) to identify potential investment trends.
Advances in AI are being used to improve research and
make informed investment decisions. In addition, big data and
AI are also boosting automation and efficiencies across client
servicing, 
data 
management, 
operational 
support, 
and
compliance.
Robo-Advisors
Robo-advisors are online financial advisors that provide
automated, algorithm-driven financial investment services.
Robo-advisors are becoming an increasingly popular and
convenient way for the individual to invest and manage
portfolios. According to IDC Financial Insight (Araneta,
Agrawal, & Kapoor, 2017), the hybrid model that combines
traditional and robo-advisory will be the winner in the market.
The total asset under management (AUM) by robo-advisors will
reach US$500b by 2021 in APAC.
For those interested in robo-advisors, refer to Chapter 19.
Chatbots
A chatbot is a human-computer dialog system relying on
auditory or textual methods. It has been widely used in our
daily life. Many companies use the virtual chatbots built into
social media platforms like WhatsApp, Facebook, or WeChat.
WeChat’s chatbot can, for example, call a taxi, check in for a
flight, report traffic accidents, and make medical appointments.


--- Page 367 ---

Most advanced chatbots use sophisticated NLP systems. Some
simple chatbots scan for keywords within the input and then
reply with the most matching keywords from a preset database.
Many banks and insurers leverage chatbots to respond to
customer’s inquiries. Chatbots not only significantly improve
the service efficiency, but can also become a marketing channel
to promote customer engagement as well as client acquisition.
More importantly, chatbots collect user’s information. Big data
allows 
the 
company 
to 
know 
more 
about 
customer’s
preferences. Targeted marketing then becomes possible.
Simpler chatbots are provided by social media platforms, and
are cost-effective and easy to maintain.
Fraud Detection
The frequency of online financial fraud attempts has been
increasing over time. Fraud detection is tricky, as fraud means
change from time to time. One major challenge is to detect
“Black Swan”–like fraud events, which are events that rarely
happen but will bring about catastrophic losses if they
happened. Fraud detection systems in the past were rule-based.
The main defect of a rule-based system is that it cannot detect
unidentified fraud means. As there is little data on such Black
Swan–like fraud cases due to their low frequency of
occurrences, detection using the old rule-based system is nearly
impossible. 
Modern 
advanced 
fraud 
systems 
adopt
sophisticated machine learning models to detect the potential
fraud, which implies that fraud can be flagged before it
happens. Rather than general machine learning black boxes, a


--- Page 368 ---

fraud system is called “white boxing,” which consists of a
scoring system based on local linear approximation, a text
mining system, graph generation, and a visualization system. It
can thus detect emerging patterns by learning new data and
generate a probability of potential fraud.
Loan/Insurance Underwriting
Traditional credit evaluation typically involves the applicant’s
FICO scores, debt to income ratio, and a number of inquiries
into the financial status/employment state of the applicants. In
recent years, as the AI ability to extract highly relevant
information for a specific purpose from a massive amount of
big 
data 
has 
greatly 
increased, 
online 
loan/insurance
underwriting has become possible.
Many AI-enabled credit assessment systems have emerged
and small loan underwriters tend to employ such an end-to-end
AI credit system to assess borrower’s credit using large
amounts of data from social and ecommerce media, which has
not been traditionally used for credit evaluation. The
customers’ behavioral traits from social media such as the
contents of text messages, the patterns of call history,
geolocation information, and mobile transaction, are valuable
information. Such information provides insight into customers’
identity, incomes, and expenses. The system adopts algorithms
and machine learning to find useful patterns in the data and
generates a default probability to gauge the suitability of the
applicant for a loan. The whole underwriting process can be
done using the mobile phone very quickly, even within 10

minutes. The granted loan can be transferred to the applicant’s

customer experience.
Similarly, insurance underwriting can also leverage on an AI
system to extract and analyze data containing information on
the applicant’s hazard likelihood, historical claims, life attitude,
and so on to generate an insurance quote quickly.
The AI underwriting system is superior as it can evaluate the
borrowers without loan/ insurance histories that are essential
in 
traditional 
underwriting. 
Compared 
to 
traditional
underwriting, banks and insurance companies will benefit
from AI-based underwriting as it reduces employee costs and

Last but not least, AI will also assist compliance officers to

Chapter 12
A Practical Approach to Machine Learning
(ML) and Artificial Intelligence (AI)
In the previous chapter, the reader would have gained an
understanding of the technologies underpinning machine
learning (ML) and artificial intelligence (AI). This chapter aims
to complement the previous chapters by providing a more
practice-oriented approach to demystifying both technologies
and to introduce the reader to the process of setting up a ML
solution. We will succinctly recap some of the key concepts
previously covered, but the readers should refer to the
dedicated chapters on data science and big data for details.
Are AI and Machine Learning the Same Thing?
While it may seem that neural networks, deep learning,
machine learning, and artificial intelligence are all the same
concepts, each has its own history and origin, as well as
hierarchy. The reason it might be hard to see this distinction is
that all the research and media attention around the last
decade of advances zoom in specifically on deep learning.
To aid in deciphering the many conflicting and overlapping
terms used in this field, we will define an overall hierarchy to
help break down the relationships within artificial intelligence.


--- Page 374 ---

Figure 12.1: AI to ML to NN to DL
To put it simply, artificial intelligence is the capability of any
system to exhibit intelligent behavior. Almost everything
relevant today in AI relates to machine learning.
Machine Learning Covers a Lot
Let us succinctly recap machine learning, which as a term
contains its own definition. Instead of the human telling the
machine what decisions and rules to make, the human teaches
it. A machine that learns. This leaves the methods of teaching
and learning open-ended. What can you teach a machine, and
what can it learn? We briefly summarize the primary machine
learning methods in Figure 12.2 and in words below.


--- Page 375 ---

Figure 12.2: Primary machine-learning methods
–
Classification algorithms can be taught to split existing data
into predefined groups, such as names of animals. When you
feed the algorithm some new data it has not yet seen, it will
predict which group the new data belongs to—for example,
that this animal is a chicken.
–
Regression algorithms basically try to learn the function of
a dataset, by predicting future data based on past data. If
you have a series of data points that form a straight line, the
algorithm will attempt to describe that line as a function. Of
course, the line could be curved, a wave, a circle, or any kind
of shape. While helpful to think of two-dimensional
examples you can plot in your mind, these algorithms also
work on any number of input dimensions.
–
Unsupervised learning can be used if you have lots of data
with patterns, groups, or clusters that you wish to separate
without explicitly defining them beforehand—that is,
without human supervision. Perhaps you know that the
dataset is comprised of different animals, and want to
establish how many different kinds by clustering them using
variables like weight and speed.


--- Page 376 ---



–
Reinforcement learning has been widely popularized by
the media attention on Deepmind’s various game playing
algorithms including the famed AlphaGo. These algorithms
learn to choose actions through the use of rewards given
based on the results of those actions in the game
environment. Due to several breakthrough results such as
AlphaGo, reinforcement methods have been an active area
of research.
While the last two methods will continue to garner many
headlines, the first two are more applicable to industries with a
much lower learning curve. The rest of this chapter will mainly
focus on classification and regression. There are many ways to
implement both, and a neural network, which we have learned
in the previous chapter, is just one approach. To ensure that the
reader can follow the practical examples later, we will quickly
revisit neural networks and recall how these fit under ML.
Neural Networks Are a Special Type of Machine Learning
Neural networks and the associated learning algorithms hold a
special place within the machine learning community, largely
due to the fact that their design is inspired by the brain. We
know that neurons are connected in vast networks inside our
brain, and that electrical signals go from neuron to neuron to
produce all of our conscious experiences—seeing, hearing,
thinking, and speaking—which involve all neural networks in
action, as far as science can tell us today.1


--- Page 377 ---

Figure 12.3: Simple neural network with weighted connections between
layers
What is inside a neural network? Neurons organized into
inputs (the left portion in Figure 12.3), hidden layers (the
middle portion in Figure 12.3), and outputs (the right portion in
Figure 12.3). Connections between these neurons have weights
and biases. The neurons, or nodes, themselves have activation
functions, which act as filters on the input data. The primary
function of all these elements is to introduce complex
behaviors. Otherwise, you could only perform basic functions
like adding numbers together. Combining these elements across
hundreds or even thousands of neurons in several layers, these
complex behaviors become very powerful indeed. This is called
deep learning.

The types of neural networks used for relatively simple tasks
like recognition of handwriting can contain hundreds of nodes
in each layer, to a point where drawing the thousands of
connections no longer helps. These specialized networks
process parts of an image at the rate of a few pixels at a time to
determine its contents.
Figure 12.5: Convolutional neural network used for image recognition


--- Page 379 ---

Still, even a large neural network can be represented visually in
rather simple terms, yet the inner behavior becomes almost
indecipherable. It can learn almost anything with a learning
process called “backpropagation,” which starts by comparing
how far the prediction is from the intended outcome. Then it
calculates a series of minute changes for the connection weights
across that whole network to improve that prediction, and tries
the prediction again to see if the result becomes better or
worse. To achieve the desired prediction accuracy, this process
will be repeated hundreds of times across large datasets of
millions of inputs, creating the need for significant computing
power and therefore computing costs.
What can you achieve with this powerful learning
approach? Neural networks can read handwriting. They can
generate language, too. They can recognize objects in pictures,
or faces, and even play chess—all at human level or beyond.
The complexity of the learning behavior also means that it is
challenging to explain predictions or decisions for each case.
You can change one input by a fraction, and the whole output
changes. Why does the learning work? When does it work?
How do we find the best and fastest way to train the network?
While this spans an active area of research, there is no
definitive answer today.

Phát hiện gian lận nhấp chuột vào quảng cáo là một khía cạnh quan trọng trong việc bảo vệ tính toàn vẹn 
và hiệu quả của hệ sinh thái quảng cáo trực tuyến. Nhà quảng cáo đầu tư phụ
nguồn lực quan trọng trong các chiến dịch kỹ thuật số để tiếp cận đối tượng mục tiêu của họ,
khiến họ dễ bị thực hiện các hoạt động gian lận làm ảnh hưởng đến lợi nhuận 
về đầu tư. Lừa đảo nhấp chuột vào quảng cáo đòi hỏi thao tác nhấp chuột lừa đảo 
trên các quảng cáo trực tuyến, thường được điều phối bởi các bot tự động hoặc indi
các video hướng tới khai thác mô hình trả tiền cho mỗi lần nhấp chuột (PPC). Để đếm
Để giải quyết mối đe dọa này, các giải pháp AI tiên tiến là rất cần thiết [18]. Thuật toán ML 
phân tích tỉ mỉ các bộ dữ liệu mở rộng, kiểm tra các mẫu hành vi của người dùng, 
tỷ lệ nhấp và số liệu tương tác để xác định dấu hiệu bất thường

xác định mức tăng đột biến về số lượng nhấp chuột hoặc các mô hình địa lý bất thường. các

và tính chất thích ứng của việc ngăn chặn gian lận nhấp chuột vào quảng cáo, cung cấp cho nhà quảng cáo 
với sự bảo vệ mạnh mẽ chống lại các hành vi lừa đảo và thúc đẩy 
môi trường quảng cáo kỹ thuật số đáng tin cậy [19].

phân tích và phát triển mô hình. Những đặc điểm này là những thuộc tính cụ thể 
hoặc các biến được trích xuất từ các nguồn dữ liệu. Họ gói gọn thông tin
được thuật toán ML sử dụng để đưa ra dự đoán hoặc phân loại. Cẩn thận 
việc lựa chọn và thiết kế các tính năng là rất quan trọng vì chúng tác động trực tiếp đến 
hiệu suất của mô hình, nhấn mạnh tầm quan trọng của cả hai nguồn dữ liệu

6.3 Phát hiện gian lận quản lý thẻ tín dụng
Phát hiện gian lận quản lý thẻ tín dụng là một khía cạnh quan trọng của việc đảm bảo 
an ninh tài chính trong thời đại kỹ thuật số ngày nay. Sự phổ biến ngày càng tăng của trực tuyến 
giao dịch và sự mở rộng liên tục của bối cảnh thương mại điện tử 
đã làm tăng đáng kể nguy cơ gian lận thẻ tín dụng. sự ngụy biện
việc phát hiện gian lận trong quản lý thẻ tín dụng đã tiến bộ đáng kể, 
phụ thuộc nhiều vào các công nghệ tiên tiến, đặc biệt là thuật toán AI và ML
vần điệu. Các thuật toán này được chế tạo cẩn thận để kiểm tra số lượng lớn 
dữ liệu giao dịch, tích cực tìm kiếm các xu hướng, sự khác thường và sai lệch 
điều đó có thể chỉ ra hành vi gian lận [26]. Các mô hình AI và ML vượt trội trong 
giám sát thời gian thực các giao dịch thẻ tín dụng, nhanh chóng xác định
hành vi nguy hiểm, chẳng hạn như mua hàng lớn và không bình thường, giao dịch
ở những vị trí địa lý bất thường hoặc khối lượng lớn bất thường 
của các giao dịch trong một khoảng thời gian ngắn. Những mô hình này thể hiện khả năng thích ứng với 
phát triển các chiến thuật lừa đảo, rất quan trọng trong môi trường mà những kẻ lừa đảo tiếp tục
thường nghĩ ra những kế hoạch mới. Ưu điểm đáng chú ý của AI và ML trong thẻ tín dụng 
phát hiện gian lận trong quản lý là khả năng phân tích dữ liệu lịch sử để 
thiết lập đường cơ sở cho hành vi bình thường của chủ thẻ. Đường cơ sở này đóng vai trò như 
một điểm tham chiếu để đánh dấu bất kỳ sai lệch nào, cho dù nó có liên quan đến sự đột biến đột ngột hay không 
về tần suất giao dịch hoặc sự thay đổi trong thói quen chi tiêu [27].
Ngoài việc chỉ xác định gian lận tiềm ẩn, quản lý thẻ tín dụng 
phát hiện gian lận cũng ưu tiên giảm thiểu các kết quả dương tính giả. AI và ML 
các thuật toán luôn được cải thiện ở khía cạnh này, trao quyền cho các nhà tài chính
tổ chức cial để giảm số lượng các giao dịch hợp pháp sai lầm
bị gắn cờ là lừa đảo. Điều này không chỉ nâng cao trải nghiệm người dùng cho 
chủ thẻ mà còn duy trì khả năng phòng vệ mạnh mẽ chống lại gian lận [28]. trong

cách tiếp cận có thể để bảo vệ chủ thẻ tín dụng khỏi hoạt động gian lận 
đồng thời giảm thiểu sự gián đoạn đối với các giao dịch hợp pháp của họ. Là công nghệ
Công nghệ tiếp tục phát triển và những kẻ lừa đảo ngày càng tinh vi hơn, 
vai trò của AI và ML trong việc phát hiện gian lận quản lý thẻ tín dụng sẽ vẫn được duy trì 
quan trọng trong việc bảo vệ cả người tiêu dùng và các tổ chức tài chính khỏi 
mối đe dọa gian lận luôn hiện hữu [29].

nhận ra rằng các thuật toán AI và ML không tránh khỏi những sai lệch có trong 
dữ liệu huấn luyện của họ. Điều này có thể dẫn đến sự phân biệt đối xử không chủ ý hoặc không công bằng 
lập hồ sơ của một số nhóm hoặc cá nhân nhất định. Điều quan trọng là phải liên tục

6.6.1 Quyền riêng tư và bảo mật dữ liệu
Quyền riêng tư và bảo mật dữ liệu là điều tối quan trọng trong lĩnh vực chuyển đổi tài chính
hành động và phát hiện gian lận. Đảm bảo tính bí mật và toàn vẹn của 
dữ liệu nhạy cảm, chẳng hạn như thông tin khách hàng và hồ sơ giao dịch, không được 
chỉ là một yêu cầu pháp lý nhưng là một khía cạnh cơ bản của niềm tin vào khả năng tài chính 
ngành công nghiệp. Để bảo vệ dữ liệu này khỏi bị truy cập trái phép hoặc vi phạm, 
bắt buộc phải thực hiện các biện pháp bảo mật nghiêm ngặt, các giao thức mã hóa, 
và kiểm soát truy cập [55]. Điều quan trọng không kém là việc thiết lập một cơ chế mạnh mẽ 
chính sách quyền riêng tư thông báo cho khách hàng về việc xử lý dữ liệu của họ,
sự minh bạch và tin cậy. Trong lĩnh vực dữ liệu chịu trách nhiệm về AI và ML 
quản lý là rất quan trọng để đạt được sự cân bằng tinh tế giữa an ninh 
và việc triển khai công nghệ có đạo đức. Các tổ chức tài chính phải đối mặt
liên tục cập nhật và sửa đổi các giao thức bảo mật và quyền riêng tư của họ để có hiệu quả
giải quyết triệt để các mối đe dọa đang nổi lên và tuân thủ các quy định đang phát triển [56].
6.6.2 Sự thiên vị và công bằng trong các mô hình AI/ML
Các vấn đề về thiên vị và công bằng có tầm quan trọng đáng kể trong các mô hình AI/ML, 
đặc biệt là trong các ứng dụng như phát hiện gian lận trong ngân hàng và 
ngành tài chính. Sự thiên vị có thể vô tình thấm vào các mô hình thông qua sự sai lệch 
dữ liệu đào tạo, dẫn đến kết quả không công bằng ảnh hưởng không tương xứng 
một số nhóm hoặc cá nhân nhất định [57]. Tính công bằng trong AI đòi hỏi phải đảm bảo rằng 
các dự đoán do mô hình đưa ra là không thiên vị và không phân biệt đối xử 
dựa trên các yếu tố nhân khẩu học, dân tộc hoặc kinh tế xã hội. Giải quyết những điều này 
những thách thức đòi hỏi phải kiểm tra, xác nhận và giám sát liên tục nghiêm ngặt
để phát hiện và giảm thiểu sự thiên vị. Ưu tiên sự công bằng cho phép các tổ chức tài chính
hướng dẫn để xây dựng các mô hình AI/ML công bằng và đáng tin cậy hơn giúp tạo ra 
các quyết định khách quan trong lĩnh vực phát hiện gian lận phức tạp [58].

hiệu quả và trách nhiệm giải trình trong hoạt động của mô hình, giải quyết các vấn đề như

phát hiện mà còn phù hợp với yêu cầu pháp lý và đạo đức ngày càng phát triển

thiệt hại mang tính thực tế, khiến việc tuân thủ quy định trở thành ưu tiên hàng đầu trong việc thực hiện
đề cập đến AI và ML để phát hiện gian lận trong lĩnh vực tài chính.
6.7 Những tiến bộ trong kỹ thuật AI/ML
Những tiến bộ trong kỹ thuật AI và ML đã thay đổi đáng kể 
bối cảnh phát hiện gian lận trong ngành tài chính ngân hàng. 
Những công nghệ này đã phát triển nhanh chóng, mang lại khả năng nâng cao 
trao quyền cho các tổ chức tài chính để đi trước các xu hướng ngày càng tinh vi hơn
những kẻ lừa đảo bịp bợm. Sự tiến bộ là sự chuyển đổi từ dựa trên quy tắc 
hệ thống sang thuật toán ML [61]. Các cách tiếp cận dựa trên quy tắc truyền thống là 
bị hạn chế về khả năng thích ứng với các mô hình gian lận mới. Ngược lại, ML 
các mô hình rất năng động và có thể liên tục học hỏi từ dữ liệu, nhận biết 
cả các chiến thuật gian lận đã biết và mới nổi. Việc áp dụng học sâu 
các kỹ thuật, như mạng lưới thần kinh, đã cải thiện hơn nữa độ chính xác và 
sự phức tạp của các mô hình phát hiện gian lận, cho phép họ xác định các mô hình phức tạp 
mô hình và sự bất thường [62].
Những tiến bộ của AI và ML đã mở ra kỷ nguyên phân tích dự đoán 
bởi vì những mô hình này hiện có thể dự đoán các mô hình gian lận tiềm ẩn dựa trên 
dữ liệu lịch sử, cho phép các tổ chức tài chính chủ động ngăn chặn gian lận
các hoạt động phong phú. Các mô hình dự đoán có thể xác định các ngoại lệ, phát hiện sự bất thường, 
và kích hoạt các cảnh báo để điều tra thêm, giảm các kết quả dương tính giả và 
nâng cao hiệu quả tổng thể của việc phát hiện gian lận [63].

hợp đồng, một tính năng của blockchain, cho phép tự động hóa gian lận 
biện pháp phòng ngừa và tăng cường an ninh giao dịch. Trong khi

logic cơ bản đằng sau các quyết định của họ [68]. AI có thể giải thích mang lại sự chuyển đổi

6.8 Thách thức và Rủi ro
Triển khai AI và ML để phát hiện gian lận trong lĩnh vực tài chính ngân hàng 
ngành gặp nhiều thách thức và rủi ro. Một thách thức lớn là 
bản chất không ngừng phát triển của các chiến thuật gian lận. Kẻ lừa đảo liên tục thích nghi 
và phát triển các kỹ thuật mới, khiến các mô hình AI và ML cần phải 
theo kịp [70]. Đi trước các mối đe dọa mới nổi đòi hỏi phải có mô hình liên tục 
sàng lọc và khả năng phát hiện các mô hình gian lận mới. Chế độ AI và ML
những thứ khác, mặc dù có độ chính xác cao nhưng không phải là không thể sai lầm và phân loại sai các giá trị hợp pháp 
giao dịch là gian lận hoặc không xác định được gian lận thực tế có thể dẫn đến 
tổn thất tài chính và sự không hài lòng của khách hàng [71].
Sự thiên vị trong dữ liệu đào tạo thiên vị của mô hình AI có thể dẫn đến sự phân biệt đối xử 
hoặc kết quả không công bằng, ảnh hưởng không tương xứng đến một số nhóm nhất định. Đảm bảo 
sự công bằng trong AI là điều cần thiết và giải quyết sự thiên vị thông qua quá trình tiền xử lý dữ liệu
việc hiệu chỉnh và hiệu chuẩn mô hình là rất quan trọng. Quyền riêng tư dữ liệu là mối quan tâm đang diễn ra 
[72]. Xử lý thông tin khách hàng nhạy cảm và nhu cầu dữ liệu giao dịch
trang web các biện pháp bảo mật và quyền riêng tư mạnh mẽ để bảo vệ chống lại các vi phạm 
hoặc truy cập trái phép. Đảm bảo rằng dữ liệu được sử dụng một cách tuân thủ và 
cách có đạo đức là ưu tiên hàng đầu. Khả năng giải thích và minh bạch là rất quan trọng. 
Hiểu cách các mô hình AI và ML đưa ra quyết định của chúng là điều cần thiết 
để xây dựng niềm tin. Bản chất “hộp đen” của một số mô hình có thể là rào cản, 
và các tổ chức tài chính phải đầu tư vào các kỹ thuật cho phép mô hình hóa 
khả năng diễn giải và kiểm toán [73].
6.8.1 Độ bền của mô hình và các cuộc tấn công đối nghịch
Ngành ngân hàng phải đảm bảo khả năng phục hồi của mô hình AI và ML 
để phát hiện gian lận và các cuộc tấn công đối nghịch tiềm ẩn phải được đặt lên hàng đầu 
ưu tiên. Các cuộc tấn công đối nghịch cố ý thay đổi dữ liệu hoặc đầu vào để đánh lừa 
mô hình, dẫn đến phân loại không chính xác và có thể vi phạm an ninh 
[74]. Kiểm tra và xác nhận liên tục là cần thiết để xác định điểm yếu
cần thiết và củng cố các mô hình AI chống lại các cuộc tấn công như vậy. Điều này đòi hỏi phải tạo ra 
các hệ thống có thể vượt qua đầu vào độc hại đồng thời liên tục cải tiến
sử dụng các thuật toán phát hiện gian lận để chống lại những mối nguy hiểm mới. Nền tảng của 
bảo vệ khu vực tài chính khỏi gian lận là sự vững chắc của mô hình, điều này cũng 
hỗ trợ độ tin cậy và độ tin cậy của hệ thống AI và ML [75].

cả lợi ích và thách thức. Để hỗ trợ phát hiện gian lận theo thời gian thực, có

Đi sâu vào gian lận tài chính  117
là một yêu cầu ngày càng tăng về tài nguyên tính toán và xử lý 
sức mạnh khi khối lượng giao dịch tăng lên. Xây dựng cơ sở hạ tầng quan trọng và 
đầu tư tài nguyên tính toán là cần thiết để giải quyết vấn đề mở rộng quy mô này
lem [76]. Điều cần thiết là phải tăng tốc và tối ưu hóa các mô hình để đạt hiệu quả trong 
để xử lý luồng dữ liệu ngày càng tăng. Khả năng mở rộng của hệ thống AI và ML 
là một cơ hội quan trọng khác. Việc mở rộng quy mô làm cho nó có thể phù hợp
cập nhật thêm thông tin và độ phức tạp, có thể cải thiện độ chính xác 
và khả năng phát hiện gian lận. Tiềm năng mở rộng quy mô này dẫn đến 
tạo ra các mô hình đáng tin cậy và dễ thích ứng hơn để có thể giải quyết các gian lận mới 
xu hướng trong ngành tài chính luôn thay đổi [77].
6.8.3 Bản chất gian lận ngày càng gia tăng
Các hệ thống phát hiện gian lận luôn gặp phải thách thức kể từ khi gian lận xảy ra 
cảnh quan luôn thay đổi [78]. Những kẻ lừa đảo liên tục tinh chỉnh 
chiến thuật, sử dụng các phương pháp ngày càng tinh vi để khai thác lỗ hổng
khả năng của hệ thống tài chính [79, 80]. Khác nhau từ tín dụng thông thường 
gian lận thẻ đến các hình thức phức tạp hơn như trộm danh tính và đánh cắp tài liệu. 
thao túng, lừa đảo biểu hiện dưới nhiều chiêu bài khác nhau. Sự ra đời của nền tảng kỹ thuật số
hình thức và thương mại điện tử đã cung cấp cho những kẻ lừa đảo những con đường mới để 
lừa dối [81]. Để chống lại điều này, các mô hình AI và ML phải duy trì 
tính chất năng động, thích ứng để xác định các mô hình gian lận mới nổi và duy trì
chủ động đón đầu các mối đe dọa ngày càng gia tăng trong môi trường không ngừng 
bối cảnh thay đổi của gian lận tài chính [82].
6.9 Kết luận và phạm vi tương lai
Ứng dụng AI và ML trong phát hiện gian lận trong hoạt động ngân hàng và 
Ngành tài chính đại diện cho một tiến bộ đáng kể trong việc củng cố an ninh
tính hợp lý và hiệu quả hoạt động. Những công nghệ này đã được chứng minh là có giá trị 
để xác định và giảm thiểu các hoạt động gian lận, cho phép tổ chức tài chính
hướng dẫn để ứng phó kịp thời với các mối đe dọa mới nổi trong thời gian thực. Tuy nhiên, 
sự tiến bộ này đi kèm với những thách thức của nó. Thích ứng liên tục 
phát triển các chiến thuật gian lận, giảm thiểu rủi ro tiềm ẩn như thiên vị và đối thủ
các cuộc tấn công ial, và tuân thủ nghiêm ngặt một vùng đất pháp lý và quy định năng động
scape là bắt buộc đối với việc sử dụng AI và ML có trách nhiệm và hiệu quả trong 
miền này. Các mô hình AI và ML đã sẵn sàng cho một tương lai đầy hứa hẹn trong thế giới 
lĩnh vực phát hiện gian lận. Sự phát triển nhanh chóng của công nghệ có thể dẫn đến 
trong các hệ thống tiên tiến và thích ứng hơn có khả năng không chỉ xác định 
các mô hình gian lận đã biết mà còn chủ động dự đoán các mối đe dọa mới nổi.

Tóm tắt
Gian lận tài chính có ảnh hưởng sâu sắc và sâu rộng đến người dân. tài chính 
các tổ chức có năng lực kỹ thuật để xác định gian lận bằng cách sử dụng trí tuệ nhân tạo thông minh
hệ thống giấy phép. Tuy nhiên, khoảng thời gian cần thiết để thu thập một lượng đáng kể 
dữ liệu lừa đảo để huấn luyện các thuật toán phát hiện gian lận của họ gây ra mối nguy hiểm đắt đỏ
ard. Ngành này phải đối mặt với những thách thức về an ninh như vi phạm quyền sở hữu trí tuệ 
quyền sở hữu, tạo nội dung có hại hoặc phân biệt đối xử và vi phạm dữ liệu. 
Các tổ chức tài chính nên sử dụng hệ thống trí tuệ nhân tạo tổng hợp bên trong 
mạng an toàn và biệt lập để giảm thiểu những rủi ro có thể xảy ra. Hơn nữa, nó là 
quan trọng để đảm bảo việc sử dụng dữ liệu đào tạo cụ thể, thực hiện triệt để 
các giao thức bảo mật, cung cấp các sáng kiến đào tạo nhân viên và tích cực giám sát 
sản lượng được sản xuất. Thiết lập cấu trúc quản trị, sử dụng tính năng phát hiện bất thường 
công nghệ, kết hợp các nguồn dữ liệu bên ngoài và xác nhận các dữ liệu được tạo 
thông tin rất được khuyến khích. Do đó, nên thành lập liên minh 
với các nhà cung cấp đáng tin cậy và tích cực tham gia vào các sáng kiến hợp tác

AI đã đóng một vai trò không thể thiếu trong nhiều giai đoạn của

Các ứng dụng hiện tại và tương lai bao gồm thuật toán AI

Giao dịch thuật toán AI
Giao dịch thuật toán/định lượng đã được các quỹ phòng hộ sử dụng
hoặc các tổ chức tài chính khác kể từ những năm 1970. Ngày nay, AI đã
trở thành xu hướng mới nổi trong quản lý tài sản
phong cảnh. Không giống như các thuật toán giao dịch truyền thống được xây dựng
để khai thác các cơ hội thị trường cụ thể như xác định
xu hướng biến động giá, AI có khả năng thực sự hoạt động như một
đại lý độc lập tham gia hoạt động thị trường.
Dữ liệu lớn và các dạng trí tuệ nhân tạo khác nhau, chẳng hạn như
ML và NLP, đã thay đổi ngành quản lý tài sản.
Sử dụng các công cụ NLP, máy có thể phân tích hoạt động của công ty
các cuộc gọi doanh thu để phát hiện những thay đổi trong tâm lý quản lý
có thể báo hiệu hiệu suất trong tương lai và sàng lọc thông qua nhà phân tích
báo cáo để chỉ ra các thuật ngữ sắp thay đổi tiêu đề của nó
dự báo. Những công cụ này cũng có thể được sử dụng để phân tích một số lượng lớn

Robot-Cố vấn
Cố vấn robot là cố vấn tài chính trực tuyến cung cấp
dịch vụ đầu tư tài chính tự động, dựa trên thuật toán.
Cố vấn robot đang ngày càng trở nên phổ biến và
cách thuận tiện cho cá nhân đầu tư và quản lý
danh mục đầu tư. Theo IDC Financial Insight (Araneta,
Agrawal, & Kapoor, 2017), mô hình lai kết hợp
tư vấn truyền thống và robot sẽ là người chiến thắng trên thị trường.
Tổng tài sản được quản lý (AUM) bởi cố vấn robo sẽ
đạt 500 tỷ USD vào năm 2021 tại APAC.
Đối với những người quan tâm đến cố vấn robot, hãy tham khảo Chương 19.
Chatbot
Chatbot là một hệ thống hội thoại giữa người và máy tính dựa trên
phương pháp thính giác hoặc văn bản. Nó đã được sử dụng rộng rãi ở nước ta
cuộc sống hàng ngày. Nhiều công ty sử dụng chatbot ảo được tích hợp sẵn
các nền tảng truyền thông xã hội như WhatsApp, Facebook hoặc WeChat.
Ví dụ: chatbot của WeChat có thể gọi taxi, đăng ký
chuyến bay, báo cáo tai nạn giao thông và đặt lịch hẹn khám bệnh.

như cộng các số lại với nhau. Kết hợp các yếu tố này xuyên suốt
hàng trăm hoặc thậm chí hàng nghìn nơ-ron ở nhiều lớp, chúng
những hành vi phức tạp thực sự trở nên rất mạnh mẽ. Đây được gọi là
học sâu.
